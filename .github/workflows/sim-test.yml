name: sim-test

# Runs the app in the iOS Simulator, grants location permission, injects a
# fake GPS coordinate, and asserts the app POSTs a well-formed location payload
# to a local mock endpoint. Lets us verify the whole capture→send path with no
# physical phone.
#
# Manual only, opt-in: dispatch this when there's an actual visual/behavioral
# claim to verify, batched — one run per change, never one run per question.
# See the "CI budget" section in MODULES.md.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-test:
    runs-on: macos-15
    env:
      BUNDLE_ID: com.oliverullman.assistantlocation
      MOCK_PORT: "8399"
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install pods
        run: pod install

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: deriveddata-${{ runner.os }}-${{ hashFiles('Overland.xcodeproj/project.pbxproj', 'Podfile.lock') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Build for simulator
        run: |
          xcodebuild \
            -workspace Overland.xcworkspace \
            -scheme Overland \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "APP_PATH=$(ls -d build/Build/Products/Debug-iphonesimulator/*.app | head -1)" >> $GITHUB_ENV

      - name: Boot simulator
        run: |
          set -x
          # Explicit iOS 26 runtime, not "whatever xcrun happens to boot".
          # Oliver's real phone is iOS 26.5 and the More-tile crash this suite
          # exists to catch is iOS-26-specific (Liquid Glass's UITabBarController
          # rewrite) -- a run 33437378601 booted iOS 18.5 and was green on this
          # exact path, proving nothing. Highest available 26.x runtime, picked
          # from what the runner actually has installed rather than a hardcoded
          # point version (26.3 exists as an Xcode install but has never shipped
          # a matching downloaded runtime -- see the diag-runtimes.yml findings
          # this was written from). Fails the job loudly, not a silent fallback
          # to 18.x, if no iOS 26 runtime is present at all.
          RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -r \
            '[.runtimes[] | select(.isAvailable) | select(.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-26"))] | sort_by(.version) | last | .identifier // empty')
          if [ -z "$RUNTIME_ID" ]; then
            echo "FATAL: no available iOS 26 simulator runtime on this runner. Installed runtimes:"
            xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.isAvailable) | .name'
            exit 1
          fi
          RUNTIME_NAME=$(xcrun simctl list runtimes -j | jq -r --arg id "$RUNTIME_ID" '.runtimes[] | select(.identifier == $id) | .name')
          echo "Selected simulator runtime: $RUNTIME_NAME ($RUNTIME_ID)"

          UDID=$(xcrun simctl list devices available -j | jq -r --arg rt "$RUNTIME_ID" \
            '.devices[$rt][]? | select(.name | test("^iPhone")) | .udid' | head -1)
          if [ -z "$UDID" ]; then
            echo "FATAL: no iPhone device type available under runtime $RUNTIME_ID"
            xcrun simctl list devices available -j | jq --arg rt "$RUNTIME_ID" '.devices[$rt]'
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          # A device booted via simctl alone has no attached display/UI
          # client. Screenshots taken against it can capture a stale,
          # undriven framebuffer — observed as a picture of the home screen
          # even while the app was verifiably alive underneath (logging,
          # posting real coordinates). Opening Simulator.app gives the device
          # a real windowserver client so `simctl io screenshot` reflects what
          # is actually rendered.
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          for i in $(seq 1 20); do
            if pgrep -x Simulator >/dev/null 2>&1; then echo "Simulator.app up after ${i}s"; break; fi
            sleep 1
          done
          # Extra settle time for the home screen to actually finish painting.
          sleep 5

          # Needed by the not-the-home-screen guard in the next step
          # (scripts/screenshot_diff_pct.py).
          if ! python3 -c "import PIL" >/dev/null 2>&1; then
            pip3 install --quiet Pillow \
              || pip3 install --quiet --user Pillow \
              || pip3 install --quiet --break-system-packages Pillow \
              || echo "WARN: could not install Pillow; the home-screen guard will skip its check"
          fi

          # Reference screenshot of the pristine home screen, taken before the
          # app is ever launched. Every later screenshot gets diffed against
          # this — see check_not_home_screen below.
          # Retry until the wallpaper has actually rendered. Grabbing this
          # too early yields an all-black frame, and then every DARK-mode app
          # screenshot resembles it: run 33287511978 measured 25-30% pixel
          # difference and failed the >50% guard, where runs 33276188407 and
          # 33286963127 (wallpaper present) measured 56-59% on the very same
          # screens. A 6-point margin means this was always one slow boot away
          # from a red run; the app was correct in all three, only the
          # reference differed. Any real wallpaper clears mean luma 8 easily.
          #
          # The luma floor is 100, not the 8 it used to be, and the run
          # records whether it was ever met. Measured, not guessed:
          #
          #   run 33323516304  reference luma  60.8  -> 18 dark-mode MISSes
          #   run 33292474600  reference luma  86.3  ->  0 MISSes
          #   run 33322953943  reference luma 133.2  ->  0 MISSes
          #
          # 8 only catches an ALL-BLACK reference. It does not catch a
          # half-faded-in one, and a dim reference breaks this guard in a
          # specific direction: the comparison counts a pixel as "same" when
          # it is within 30/255, so a dark reference resembles every
          # DARK-MODE app screenshot. Run 33323516304 failed all 18 dark
          # shots at 28-30% while every light shot passed and the app was
          # verifiably fine (the grid renders correctly in the artifacts) —
          # the guard was measuring the reference, not the app.
          HOME_REF_OK=0
          for attempt in $(seq 1 10); do
            xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/home-reference.png"
            mean=$(python3 -c 'import sys; from PIL import Image; im = Image.open(sys.argv[1]).convert("L"); print(sum(im.getdata()) / (im.width * im.height))' "$GITHUB_WORKSPACE/home-reference.png" 2>/dev/null || echo 0)
            if python3 -c 'import sys; sys.exit(0 if float(sys.argv[1]) > 100 else 1)' "$mean"; then
              echo "home-reference captured on attempt $attempt (mean luma $mean)"
              HOME_REF_OK=1
              break
            fi
            echo "home-reference too dark to compare against (mean luma $mean), retrying"
            sleep 3
          done
          if [ "$HOME_REF_OK" -ne 1 ]; then
            echo "WARN: the home-screen reference never brightened past the floor; the not-the-home-screen guard will report but not fail this run"
          fi
          echo "HOME_REF_OK=$HOME_REF_OK" >> $GITHUB_ENV

      - name: Run app in simulator + assert it POSTs a location
        run: |
          set -x
          FAIL=0
          HOME_REF="$GITHUB_WORKSPACE/home-reference.png"

          # Positive check that a screenshot actually shows the app and not
          # the home screen / springboard. Compares against the pre-launch
          # home-reference.png with scripts/screenshot_diff_pct.py (whole-
          # image pixel-difference percentage, thresholded to ignore
          # anti-aliasing noise) rather than an exact hash: a springboard
          # screenshot taken at a different clock time still hashes
          # differently from the reference, but only a handful of pixels (the
          # clock digits) actually differ, whereas real app content differs
          # over most of the screen.
          #
          # Threshold calibrated against real captures, not guessed: a run
          # that crash-looped back to springboard on every launch (see
          # App/SceneDelegate.m's GLSceneDebugLog history) produced 9
          # screenshots that were byte-identical to EACH OTHER but 20.7%
          # different from home-reference.png — SpringBoard pages itself to
          # show the newly-installed app's icon right after install, so even
          # "still on the home screen" can legitimately differ from a
          # pre-install reference by a fifth of the pixels. Genuine app
          # content measured 87-98% different in the same comparison. 50%
          # sits with wide margin on both sides of that gap.
          #
          # An earlier version of this guard shelled out to ImageMagick's
          # `compare -metric AE`, which silently reported ~0% difference for
          # screenshots independently verified (via this same PIL diff, run
          # by hand against the downloaded artifacts) to differ by 87-98% —
          # a false negative in the guard itself, not a real capture failure.
          # Replaced outright rather than debugged further.
          # Optional 3rd arg "soft": downgrade a MISS here to a WARN and
          # set SOFT_HOME_SCREEN_MISS=1 instead of FAIL=1. Used ONLY for the
          # dusk "more" targets (see below) -- their pale gradient can
          # legitimately sit close enough to the simulator's own pale home
          # screen to trip this whole-frame heuristic by coincidence (run
          # 33540952926 measured more-dusk-light at 49.4%, under the 50%
          # floor, even though run 33538866789's tile-lightness/palette-keys
          # reads proved that exact screenshot's More grid genuinely
          # rendered -- and run 33445198470 shows this target sitting
          # marginally under the line before any of this session's changes,
          # so it is a pre-existing false-positive risk on this one target,
          # not something the dusk-light fix introduced). Every other caller
          # keeps the strict default: this whole-frame diff is the ONLY
          # launch evidence they have.
          check_not_home_screen() {
            local shot="$1" label="$2" mode="${3:-strict}"
            if [ ! -s "$shot" ]; then
              echo "MISS: $label screenshot missing or empty ($shot)"; FAIL=1; return
            fi
            local out pct_int
            out=$(python3 scripts/screenshot_diff_pct.py "$HOME_REF" "$shot" 2>&1) || true
            if [[ ! "$out" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "WARN: could not compare $label to the home-screen reference: $out"
              return
            fi
            echo "compare($label): ${out}% of pixels differ from the home screen"
            pct_int=${out%.*}
            if [ "$pct_int" -lt 50 ]; then
              if [ "${HOME_REF_OK:-0}" -ne 1 ]; then
                # A reference too dark to compare against makes this check
                # meaningless, not failed — every dark-mode screenshot
                # resembles it. Report and move on rather than turning the
                # whole run red for something that says nothing about the app.
                echo "WARN: $label differs from the home reference by only ${out}%, but that reference was too dark to judge against — not failing"
              elif [ "$mode" = soft ]; then
                echo "WARN: $label screenshot only ${out}% different from the pre-launch reference (below the 50% floor) -- not failing here, a stronger per-pixel check follows below"
                SOFT_HOME_SCREEN_MISS=1
              else
                echo "MISS: $label screenshot looks like the home screen, not the app (only ${out}% of pixels differ from the pre-launch reference)"
                FAIL=1
              fi
            fi
          }

          # Poll for the process actually being alive before screenshotting,
          # instead of a blind sleep — the runner has been observed taking
          # over a dozen seconds just to write a screenshot file.
          wait_for_app_process() {
            local waited=0
            while [ "$waited" -lt 15 ]; do
              if xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
                return 0
              fi
              sleep 1
              waited=$((waited + 1))
            done
            echo "WARN: $BUNDLE_ID did not show up in launchctl list within ${waited}s"
            return 1
          }

          # Start the mock endpoint (kept alive for this whole step).
          python3 scripts/mock_endpoint.py /tmp/received.log ${MOCK_PORT} >/tmp/mock.out 2>&1 &
          MOCK_PID=$!
          # Wait until it actually binds.
          for i in $(seq 1 20); do
            if curl -s -X POST http://127.0.0.1:${MOCK_PORT}/overland -d '{"locations":[]}' >/dev/null; then
              echo "mock up after ${i}s"; break
            fi
            sleep 1
          done
          curl -s -X POST http://127.0.0.1:${MOCK_PORT}/overland -d '{"locations":[]}' || { echo "mock failed to start"; cat /tmp/mock.out; exit 1; }

          # Install + drive the app headlessly via its NSUserDefaults keys.
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLAPIEndpointDefaults "http://127.0.0.1:${MOCK_PORT}/overland"
          # A dummy token, so the run can assert the token actually reaches the
          # Authorization header (see the auth=Bearer check below).
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLAPIAccessTokenDefaults "simtok0123456789"
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLTrackingStateDefaults -bool YES
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLPointsPerBatchDefaults -int 1
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLSendIntervalDefaults -int 1
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLDiscardPointsWithinDistanceDefaults -int 0
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLDiscardPointsWithinSecondsDefaults -int 0

          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLPointsPerBatchDefaults -int 0

          xcrun simctl privacy "$SIM_UDID" grant location-always "$BUNDLE_ID"
          # Microphone too: the Sessions voice step calls voiceStart, and an
          # unanswered mic alert survives every later relaunch, leaving the
          # app inactive -- run 34774549657's more-dusk shots showed it still
          # up and the palette-keys read never ran.
          xcrun simctl privacy "$SIM_UDID" grant microphone "$BUNDLE_ID"
          # Photos too: the Journal page asks for library access on load, and the
          # unanswered alert covered every later deep-link launch (Outfits and
          # Clips reports came back empty, runs 42432145435..42506098353).
          xcrun simctl privacy "$SIM_UDID" grant photos "$BUNDLE_ID"
          # Esme's daily-reminder scheduling (EsmeModule.m) requests
          # UNUserNotificationCenter authorization on first launch, which pops
          # a system alert. Nothing in this run taps it, so without a
          # pre-grant it sits on screen for the rest of the test and every
          # screenshot/tap after the app's first cold launch silently fails
          # (measured: journal-tile-tap and events-tile-tap both "barely
          # differs from the More grid", both dusk palette reads came back
          # empty -- run 34361246296). Unlike location, `simctl privacy grant
          # notifications` is not a real TCC service on this simulator/Xcode
          # -- it fails outright ("Operation not permitted", run 34364065270)
          # rather than pre-authorizing anything, so it can't be the fix.
          # Same shape as the other UITEST_* defaults-write hooks below
          # (GLPointsPerBatchDefaults etc.): write a defaults key EsmeModule.m
          # checks to skip the real authorization request (and therefore the
          # modal) entirely during this run.
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" UITestSkipNotificationPrompt -bool true

          echo "=== defaults readback (confirm they applied) ==="
          xcrun simctl spawn "$SIM_UDID" defaults read "$BUNDLE_ID" || echo "(no defaults domain!)"

          # Reliable app-log capture via log stream (NSLog -> os_log).
          xcrun simctl spawn "$SIM_UDID" log stream --level debug --style compact \
            --predicate 'process == "Overland"' > /tmp/app.log 2>&1 &
          LOG_PID=$!
          sleep 2

          echo "=== launch ==="
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 4
          # Screenshot the main (default-tab) screen.
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/main-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/main-screen.png" "main-screen"
          sleep 2

          # Simulate a MOVING route (continuous didUpdateLocations callbacks) —
          # a static 'set' often doesn't drive updates. Runs in background.
          xcrun simctl location "$SIM_UDID" start --speed 15 --distance 20 \
            40.7128,-74.0060 40.7180,-74.0100 40.7230,-74.0140 40.7280,-74.0180 &
          LOC_PID=$!
          sleep 40
          kill $LOC_PID 2>/dev/null || true
          xcrun simctl location "$SIM_UDID" clear 2>/dev/null || true

          echo "=== authorization + queue DB (did the app CAPTURE points?) ==="
          CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" data 2>/dev/null)
          echo "container: $CONTAINER"
          QDB="$CONTAINER/Library/Caches/GLLoggerCache.sqlite"
          if [ -f "$QDB" ]; then
            echo "queue rows: $(sqlite3 "$QDB" 'SELECT count(*) FROM data;' 2>/dev/null || echo '?')"
            sqlite3 "$QDB" 'SELECT substr(value,1,120) FROM data LIMIT 2;' 2>/dev/null || true
          else
            echo "(no queue DB at $QDB)"
          fi

          echo "=== app NSLogs ==="
          grep -iE "Monitoring|Author|Sending|Received|batch|Requesting" /tmp/app.log | sed -E 's/^[0-9T:.Z+-]+ //' | head -20 || true
          echo "=== received.log ==="; cat /tmp/received.log || true; echo "===================="

          # Screenshot every module's tab. UITEST_TAB is read by SceneDelegate
          # and is the tab's INDEX in the module-order sort (see MODULES.md,
          # +moduleOrder ascending): 0 New Session (50, Sessions), 1 Events (100), 2 Todos (150), 3 Football (200),
          # 4 Settings (300), 5 Finances (610, moved out of the visible bar
          # into the More grid to make room for Esme), 6 Journal/AutoJournal
          # (620), 7 Esme (650), 8 Growth (660, in More now; the default tab
          # outside its quiet window), 9 Outfits (670), 10 Upload (690),
          # 11 Tracker (700), 12 Continue? (705, GoalTracker), 13 Sleep (706, SleepTracker, last in More). Tracker and Upload sit at the bottom of
          # the More grid per Oliver's request.
          # Keep this list in sync with the modules' +moduleOrder values, not
          # assumed — a new module or a reorder changes it. A new module
          # appends its entry here, to the appearance-sweep list below, and
          # to both artifact path lists at the bottom.
          TAB_ENTRIES=("0 newsession" "1 events" "2 todos" "3 football" "4 settings" "5 finances" "6 journal" "7 esme" "8 growth" "9 outfits" "10 upload" "11 tracker" "12 continue" "13 sleep" "14 debate" "15 clips" "more more")
          # "more" is not an index: it selects moreNavigationController
          # itself (see SceneDelegate UITEST_TAB), so the system More
          # LIST gets screenshotted, not the module behind it.

          for TAB_ENTRY in "${TAB_ENTRIES[@]}"; do
            set -- $TAB_ENTRY
            TAB_INDEX=$1
            TAB_NAME=$2
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
            sleep 1
            SIMCTL_CHILD_UITEST_TAB=$TAB_INDEX xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
            wait_for_app_process || true
            sleep 4
            xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/${TAB_NAME}-screen.png" || true
            check_not_home_screen "$GITHUB_WORKSPACE/${TAB_NAME}-screen.png" "$TAB_NAME"
          done

          # Esme sits past the fourth tab (+moduleOrder 650), so it is
          # reached through the system More list and UIKit pushes it onto
          # moreNavigationController — which used to give it a "< More" back
          # header no direct tab has. GLModuleRegistry's GLMoreListThemer
          # hides that bar; this asserts it stayed hidden.
          #
          # Todos is the reference because it is a direct tab running the SAME
          # GLWebModuleViewController, and in CI neither can reach the real
          # server (no GL_BAKED_HOST is baked here), so both render the
          # identical native error view — the strip below the status bar is
          # pixel-identical unless one of them has extra chrome. See
          # scripts/check_no_more_header.py for the measured thresholds.
          #
          # This is the ONE module asserted rather than every More entry:
          # Journal/Tracker/Settings/Upload get the same fix, but they are
          # native screens whose own content legitimately occupies that strip,
          # so a pixel comparison against a web module's blank band would fail
          # them for the wrong reason.
          echo "=== More-module header guard ==="
          HEADER_OUT=$(python3 scripts/check_no_more_header.py \
            "$GITHUB_WORKSPACE/todos-screen.png" \
            "$GITHUB_WORKSPACE/esme-screen.png" 2>&1) || true
          echo "check_no_more_header(esme): $HEADER_OUT"
          case "$HEADER_OUT" in
            MISS:*) echo "$HEADER_OUT"; FAIL=1 ;;
            ERROR:*) echo "WARN: could not run the More-header guard: $HEADER_OUT" ;;
          esac

          # Open a More-grid TILE through the grid's own tap handler, which
          # UITEST_TAB never reaches (that sets selectedIndex, i.e. UIKit's
          # routing, not ours). Journal specifically: it is the one module
          # that wraps itself in a UINavigationController, and pushing one of
          # those raises NSInvalidArgumentException — so if the grid ever goes
          # back to pushing indiscriminately, the app dies here and the
          # not-the-home-screen guard below turns this red. A screenshot-only
          # suite cannot catch that any other way.
          for TILE_ENTRY in "GLModule.AutoJournalModule journal-tile" "GLModule.EsmeModule esme-tile" "GLModule.DebateModule debate-tile"; do
            set -- $TILE_ENTRY
            TILE_ID=$1
            TILE_NAME=$2
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
            sleep 1
            SIMCTL_CHILD_UITEST_MORE_TILE=$TILE_ID xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
            wait_for_app_process || true
            sleep 5
            xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/${TILE_NAME}-screen.png" || true
            check_not_home_screen "$GITHUB_WORKSPACE/${TILE_NAME}-screen.png" "$TILE_NAME"
            # An app that raised on the push is gone from launchctl by now;
            # a screenshot alone could still look plausible if the crash
            # happened after the frame was drawn.
            if ! xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
              echo "MISS: $TILE_NAME — app is no longer running after opening the tile (crashed?)"
              FAIL=1
            fi
          done

          # Same two tiles, but tapped THROUGH THE WEB PAGE (UITEST_MORE_TILE_TAP)
          # rather than by calling GLModuleRegistry's open method natively. The
          # loop above never touches more.html, gl-bridge.js, or GLWebBridge's
          # `openModule` handler -- it calls straight into
          # +openMoreTileWithIdentifier:, which is exactly why it stayed green
          # on the real bug: Oliver's crash happens tapping the tile ON HIS
          # PHONE, i.e. through the page's own click handler -> GLBridge.call
          # -> the WKScriptMessageHandler -> GLWebBridge -> here. This is the
          # one loop in this file that exercises that whole chain.
          for TILE_ENTRY in "GLModule.AutoJournalModule journal-tile-tap" "GLModule.EsmeModule esme-tile-tap"; do
            set -- $TILE_ENTRY
            TILE_ID=$1
            TILE_NAME=$2
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
            sleep 1
            SIMCTL_CHILD_UITEST_MORE_TILE_TAP=$TILE_ID xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
            wait_for_app_process || true
            # Generous settle: SceneDelegate.m's UITEST_MORE_TILE_TAP hook
            # waits 1.5s before it even starts, then the tile-tap itself polls
            # the DOM for up to 8s (GLModuleRegistry
            # +tapMoreGridTileWithIdentifier:completionHandler:) before giving
            # up -- run 33441445404 measured a fixed 1.5s-then-tap as too
            # short (every attempt logged "NO SUCH TILE IN DOM"), so this
            # comfortably outlasts the hook's own worst case rather than
            # guessing a new fixed number.
            sleep 12
            xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/${TILE_NAME}-screen.png" || true
            check_not_home_screen "$GITHUB_WORKSPACE/${TILE_NAME}-screen.png" "$TILE_NAME"
            if ! xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
              echo "MISS: $TILE_NAME — app is no longer running after tapping the tile in the web page (crashed?)"
              FAIL=1
            fi
            # A screenshot that still looks like the More grid (tap never
            # actually navigated anywhere) would pass check_not_home_screen
            # above -- it's real app content, just the WRONG screen. Diff it
            # against more-screen.png (this same run's own More-tab
            # screenshot, taken earlier in the TAB_ENTRIES loop above) so
            # "the tap dispatched but nothing opened" fails loudly instead of
            # reading as a pass.
            DEST_OUT=$(python3 scripts/screenshot_diff_pct.py \
              "$GITHUB_WORKSPACE/more-screen.png" \
              "$GITHUB_WORKSPACE/${TILE_NAME}-screen.png" 2>&1) || true
            echo "compare($TILE_NAME vs more-screen, did the tap navigate anywhere): ${DEST_OUT}% differ"
            if [[ "$DEST_OUT" =~ ^[0-9]+\.[0-9]+$ ]]; then
              DEST_INT=${DEST_OUT%.*}
              # Measured, not guessed (matches this file's own convention):
              # run 33445198470 confirmed via screenshot that a REAL,
              # successful navigation (Events' own error view / Journal's own
              # recorder screen, both correctly reached through the web tap)
              # measures only 3.3-3.9% different from the More grid -- both
              # destinations are still overwhelmingly white/pale background.
              # A genuine failed tap (run 33443356330, tile never found in the
              # DOM, nothing ever clicked) measured 0.1%. 15 was a guess with
              # no margin on the real-success side; 1 sits with wide margin on
              # both sides of the measured gap.
              if [ "$DEST_INT" -lt 1 ]; then
                echo "MISS: $TILE_NAME screenshot barely differs from the More grid (${DEST_OUT}%) -- the tap did not navigate to the module"
                FAIL=1
              fi
            else
              echo "WARN: could not pixel-compare $TILE_NAME to more-screen.png: $DEST_OUT"
            fi
          done

          # Open Journal's Recent-recordings web page directly (UITEST_JOURNAL_RECENTS,
          # SceneDelegate.m), the one push in the Settings/More/Recents
          # web-conversion work none of the loops above reach: it's neither a
          # tab (UITEST_TAB) nor a More tile (UITEST_MORE_TILE), but a push
          # from inside the already-selected Journal tab.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          SIMCTL_CHILD_UITEST_JOURNAL_RECENTS=1 xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 5
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/recents-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/recents-screen.png" "recents"

          # --- Sessions: overland://session/text deep link -----------------
          # Proves the WHOLE chain end-to-end: SceneDelegate -> GLModuleRegistry
          # routeURL: -> SessionsModule +moduleHandleURL: -> its tab
          # is selected, showing SessionsViewController -> session.html loads -> its
          # loadProjects()/loadRecent() actually issue GET requests carrying
          # a real Bearer token, all the way to a real (mock) server. Every
          # other managed-page assertion in this workflow stops at "a
          # non-home screen rendered" -- this is the one that checks the
          # page's OWN network calls actually fired, per this review round's
          # explicit ask. See GLWebModuleViewController.m's
          # UITEST_WEBPAGE_API_BASE hook (bootScriptSource) for how the mock
          # gets substituted for the real, unbaked-in-CI location-server host.
          echo "=== Sessions: overland://session/text ==="
          # `simctl openurl` stops at iOS 26's "Open in ...?" alert, so the
          # app opens the URL on itself (SceneDelegate's UITEST_OPEN_URL),
          # which routes through -scene:openURLContexts: like the real
          # Control Center button. The launch also persists
          # UITEST_WEBPAGE_API_BASE for the voice case below.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          LOG_LINES_BEFORE_WARM=$(wc -l < /tmp/received.log)
          SIMCTL_CHILD_UITEST_WEBPAGE_API_BASE="http://127.0.0.1:${MOCK_PORT}" \
          SIMCTL_CHILD_UITEST_OPEN_URL="overland://session/text" \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 7
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/session-text-warm-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/session-text-warm-screen.png" "session-text-warm"
          echo "--- mock log since warm openurl ---"
          tail -n +$((LOG_LINES_BEFORE_WARM + 1)) /tmp/received.log
          if ! tail -n +$((LOG_LINES_BEFORE_WARM + 1)) /tmp/received.log | grep -q "GET /sessions/projects auth=Bearer"; then
            echo "FAIL: mock never received GET /sessions/projects with a Bearer token after the warm openurl"
            exit 1
          fi

          echo "=== Sessions: overland://session/voice ==="
          # No UITEST_WEBPAGE_API_BASE env this time: the page must still
          # reach the mock via the value the launch above persisted.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          LOG_LINES_BEFORE_COLD=$(wc -l < /tmp/received.log)
          SIMCTL_CHILD_UITEST_OPEN_URL="overland://session/voice" \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 7
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/session-voice-cold-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/session-voice-cold-screen.png" "session-voice-cold"
          echo "--- mock log since cold openurl ---"
          tail -n +$((LOG_LINES_BEFORE_COLD + 1)) /tmp/received.log
          if ! tail -n +$((LOG_LINES_BEFORE_COLD + 1)) /tmp/received.log | grep -q "GET /sessions/projects auth=Bearer"; then
            echo "FAIL: mock never received GET /sessions/projects with a Bearer token after the cold openurl"
            exit 1
          fi

          echo "=== Sessions: overland://session/text?attach=... (ShareToDesktop 'Start conversation') ==="
          # Proves SessionsModule +moduleHandleURL:'s attach-id parsing and
          # SessionsViewController's addAttachments forward reach the page,
          # the same cold-launch path as the two openurl checks above. The
          # assertion below only holds once session.html actually defines
          # window.addAttachments (the page side of this contract, landing
          # separately -- see MODULES.md) -- gated so this step is a real
          # SKIP, not a silent false-pass, until that lands.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          LOG_LINES_BEFORE_ATTACH=$(wc -l < /tmp/received.log)
          SIMCTL_CHILD_UITEST_OPEN_URL="overland://session/text?attach=11111111-2222-3333-4444-555555555555.png" \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 7
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/session-attach-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/session-attach-screen.png" "session-attach"
          echo "--- mock log since attach openurl ---"
          tail -n +$((LOG_LINES_BEFORE_ATTACH + 1)) /tmp/received.log
          if grep -q addAttachments Modules/WebPages/session.html; then
            if ! tail -n +$((LOG_LINES_BEFORE_ATTACH + 1)) /tmp/received.log | grep -q "GET /sessions/upload/11111111-2222-3333-4444-555555555555.png auth=Bearer"; then
              echo "FAIL: mock never received GET /sessions/upload/<id> with a Bearer token after the attach openurl"
              exit 1
            fi
          else
            echo "SKIP: session.html has no window.addAttachments yet (page side lands separately) -- native attach-id plumbing only, not asserted end-to-end here"
          fi

          # --- Outfits: overland://outfits/<path> deep link -----------------
          # Asserts on the page itself: OutfitsModule's UITEST_REPORT_OUTFITS
          # hook logs whether the Outfits view is on screen and the web
          # view's own location.href (not an accessibility frame). The tab is
          # pointed at the local mock (UITEST_OUTFITS_BASE_URL) because CI has
          # no baked host, so the page would otherwise never load.
          for CASE in "media/test|#/media/test" "media/ABC123%2FL0%2F001|#/media/ABC123%2FL0%2F001"; do
            OUTFITS_PATH="${CASE%%|*}"
            OUTFITS_SUFFIX="${CASE##*|}"
            echo "=== Outfits: overland://outfits/${OUTFITS_PATH} ==="
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
            sleep 1
            OUTFITS_LOG_BEFORE=$(wc -l < /tmp/app.log)
            SIMCTL_CHILD_UITEST_OUTFITS_BASE_URL="http://127.0.0.1:${MOCK_PORT}/" \
            SIMCTL_CHILD_UITEST_REPORT_OUTFITS=1 \
            SIMCTL_CHILD_UITEST_OPEN_URL="overland://outfits/${OUTFITS_PATH}" \
              xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
            wait_for_app_process || true
            sleep 14
            xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/outfits-link-screen.png" || true
            REPORT=$(tail -n +$((OUTFITS_LOG_BEFORE + 1)) /tmp/app.log | grep "UITEST_OUTFITS_REPORT" | tail -1 || true)
            echo "report: $REPORT"
            case "$REPORT" in
              *"onScreen=1"*"href=http://127.0.0.1:${MOCK_PORT}/"*"${OUTFITS_SUFFIX} "*) echo "PASS: Outfits on screen, href ends with ${OUTFITS_SUFFIX}" ;;
              *) echo "FAIL: expected Outfits on screen with href ending ${OUTFITS_SUFFIX}"; exit 1 ;;
            esac
          done

          echo "=== Clips: overland://clips/test-clip?section=b ==="
          # Mock serves a real 30s m4a (afconvert) at /clips/files/test-clip.m4a.
          # Cold launch with the deep link: the tab must be selected, download
          # the clip, and start playback. playing=1 is asserted 3s in; currentTime
          # is only logged.
          python3 - <<'PYEOF'
          import math, struct, wave
          w = wave.open("/tmp/clip.wav", "wb")
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(22050)
          w.writeframes(b"".join(struct.pack("<h", int(8000 * math.sin(2 * math.pi * 440 * i / 22050))) for i in range(22050 * 30)))
          w.close()
          PYEOF
          afconvert -f m4af -d aac -b 64000 /tmp/clip.wav /tmp/clip.m4a
          ls -l /tmp/clip.m4a
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          CLIPS_LOG_BEFORE=$(wc -l < /tmp/app.log)
          SIMCTL_CHILD_UITEST_CLIPS_BASE_URL="http://127.0.0.1:${MOCK_PORT}/" \
          SIMCTL_CHILD_UITEST_REPORT_CLIPS=1 \
          SIMCTL_CHILD_UITEST_CLIPS_SPEED=1.25 \
          SIMCTL_CHILD_UITEST_CLIPS_NOTE="left hand" \
          SIMCTL_CHILD_UITEST_CLIPS_LOOP=1 \
          SIMCTL_CHILD_UITEST_CLIPS_SECTION_NUDGE=1 \
          SIMCTL_CHILD_UITEST_OPEN_URL="overland://clips/test-clip?section=b" \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          # The report waits for the section loop to wrap (up to ~36s on a slow runner).
          for _ in $(seq 1 60); do
            tail -n +$((CLIPS_LOG_BEFORE + 1)) /tmp/app.log | grep -q "UITEST_CLIPS_REPORT" && break
            sleep 1
          done
          sleep 1
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/clips-link-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/clips-link-screen.png" "clips-link"
          tail -n +$((CLIPS_LOG_BEFORE + 1)) /tmp/app.log | grep -i "clips" || true
          CLIPS_REPORT=$(tail -n +$((CLIPS_LOG_BEFORE + 1)) /tmp/app.log | grep "UITEST_CLIPS_REPORT" | tail -1 || true)
          echo "report: $CLIPS_REPORT"
          case "$CLIPS_REPORT" in
            *"onScreen=1"*"id=test-clip"*"playing=1"*"rate=1.25"*"speed=1.25"*"notes=1"*) echo "PASS: Clips player open, test-clip playing at rate 1.25 with 1 note" ;;
            *) echo "FAIL: expected the player on screen, test-clip playing at rate=1.25 with notes=1"; exit 1 ;;
          esac
          # Section loop: the deep link selected section b (mock: 6-11s), loop is on,
          # and the nudge hook moved its start to 6.5. The playhead must have stayed
          # inside [start, end] across at least one wrap.
          case "$CLIPS_REPORT" in
            *"loop=1"*"section=b"*"start=6.50"*"end=11.00"*) ;;
            *) echo "FAIL: expected loop=1 section=b start=6.50 end=11.00"; exit 1 ;;
          esac
          field() { echo "$CLIPS_REPORT" | sed -n "s/.* $1=\([-0-9.a-z]*\).*/\1/p"; }
          S=$(field start); E=$(field end); MIN=$(field min); MAX=$(field max); WRAPS=$(field wraps)
          echo "section loop: start=$S end=$E min=$MIN max=$MAX wraps=$WRAPS"
          awk -v s="$S" -v e="$E" -v mn="$MIN" -v mx="$MAX" -v w="$WRAPS" 'BEGIN { exit !(w >= 1 && mn >= s - 0.05 && mx <= e + 0.05) }' \
            || { echo "FAIL: section loop left its bounds or never wrapped"; exit 1; }
          echo "PASS: section loop stayed within bounds across $WRAPS wraps"
          # The nudged section list was queued and POSTed to the server.
          grep -A1 "POST /clips/test-clip/sections auth=Bearer" /tmp/received.log | grep -q '"start":6.5' || { echo "FAIL: mock never received the edited sections"; tail -20 /tmp/received.log; exit 1; }
          echo "PASS: section edit reached the server"
          # The note was written locally, queued in the outbox, and POSTed.
          grep -A1 "POST /clips/test-clip/notes auth=Bearer" /tmp/received.log | grep -q "left hand" || { echo "FAIL: mock never received the note POST"; cat /tmp/received.log | tail -20; exit 1; }
          echo "PASS: note reached the server"
          grep -q "GET /clips/files/test-clip.m4a auth=Bearer" /tmp/received.log || { echo "FAIL: mock never served the clip file"; exit 1; }

          # Scrub: the hook drives the real scrub handlers (drag 50% -> 60%, release) and
          # samples the thumb. Slider must start disabled, be enabled once ready, hold the
          # dragged spot (no snap back) and end where it was released.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          SCRUB_LOG_BEFORE=$(wc -l < /tmp/app.log)
          SIMCTL_CHILD_UITEST_CLIPS_BASE_URL="http://127.0.0.1:${MOCK_PORT}/" \
          SIMCTL_CHILD_UITEST_CLIPS_SCRUB=1 \
          SIMCTL_CHILD_UITEST_OPEN_URL="overland://clips/test-clip" \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          for _ in $(seq 1 40); do
            tail -n +$((SCRUB_LOG_BEFORE + 1)) /tmp/app.log | grep -q "UITEST_CLIPS_SCRUB" && break
            sleep 1
          done
          SCRUB_OPENED=$(tail -n +$((SCRUB_LOG_BEFORE + 1)) /tmp/app.log | grep "UITEST_CLIPS_OPENED" | tail -1 || true)
          SCRUB_REPORT=$(tail -n +$((SCRUB_LOG_BEFORE + 1)) /tmp/app.log | grep "UITEST_CLIPS_SCRUB" | tail -1 || true)
          echo "opened: $SCRUB_OPENED"; echo "scrub: $SCRUB_REPORT"
          [ -n "$SCRUB_REPORT" ] || { echo "FAIL: no UITEST_CLIPS_SCRUB line (player never became ready?)"; tail -n +$((SCRUB_LOG_BEFORE + 1)) /tmp/app.log | grep -i clips; exit 1; }
          sfield() { echo "$SCRUB_REPORT" | sed -n "s/.* $1=\([-0-9.]*\).*/\1/p"; }
          ST=$(sfield target); SMIN=$(sfield minSlider); SFIN=$(sfield final)
          case "$SCRUB_REPORT" in
            *"enabledAtOpen=0"*"enabledReady=1"*) ;;
            *) echo "FAIL: expected slider disabled at open and enabled when ready: $SCRUB_REPORT"; exit 1 ;;
          esac
          awk -v t="$ST" -v mn="$SMIN" -v f="$SFIN" 'BEGIN { exit !(t > 0 && mn >= t - 0.5 && f - t <= 1.0 && t - f <= 1.0) }' \
            || { echo "FAIL: scrub thumb snapped back or ended away from target (want minSlider>=target-0.5, |final-target|<=1.0): $SCRUB_REPORT"; exit 1; }
          echo "PASS: scrub held the dragged position (target=$ST min=$SMIN final=$SFIN), slider disabled at open and enabled when ready"

          # Next-section button: deep link to b (6-11s), the hook presses next after 2s,
          # playback must move to the following section (transition, 11s). No loop here.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          NEXT_LOG_BEFORE=$(wc -l < /tmp/app.log)
          SIMCTL_CHILD_UITEST_CLIPS_BASE_URL="http://127.0.0.1:${MOCK_PORT}/" \
          SIMCTL_CHILD_UITEST_REPORT_CLIPS=1 \
          SIMCTL_CHILD_UITEST_CLIPS_NEXT=1 \
          SIMCTL_CHILD_UITEST_OPEN_URL="overland://clips/test-clip?section=b" \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          for _ in $(seq 1 40); do
            tail -n +$((NEXT_LOG_BEFORE + 1)) /tmp/app.log | grep -q "UITEST_CLIPS_REPORT" && break
            sleep 1
          done
          sleep 1
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/clips-toc-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/clips-toc-screen.png" "clips-toc"
          NEXT_LINE=$(tail -n +$((NEXT_LOG_BEFORE + 1)) /tmp/app.log | grep "UITEST_CLIPS_NEXT" | tail -1 || true)
          NEXT_REPORT=$(tail -n +$((NEXT_LOG_BEFORE + 1)) /tmp/app.log | grep "UITEST_CLIPS_REPORT" | tail -1 || true)
          echo "next: $NEXT_LINE"; echo "report: $NEXT_REPORT"
          case "$NEXT_LINE" in
            *"from=b"*"to=transition"*"start=11.00"*) ;;
            *) echo "FAIL: next-section did not select transition at 11.00"; exit 1 ;;
          esac
          case "$NEXT_REPORT" in
            *"playing=1"*"section=transition"*) echo "PASS: next-section moved playback to the next section's start" ;;
            *) echo "FAIL: after next, expected playing with section=transition"; exit 1 ;;
          esac
          NT=$(echo "$NEXT_REPORT" | sed -n "s/.* time=\([0-9.]*\).*/\1/p")
          awk -v t="$NT" 'BEGIN { exit !(t >= 10.9) }' || { echo "FAIL: playhead at $NT, still before the next section"; exit 1; }

          # Practice take: real mic recording, real upload to the mock (song = take + 5),
          # plays the take, then Back to song must reach the mapped song time.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          TAKE_LOG_BEFORE=$(wc -l < /tmp/app.log)
          SIMCTL_CHILD_UITEST_CLIPS_BASE_URL="http://127.0.0.1:${MOCK_PORT}/" \
          SIMCTL_CHILD_UITEST_CLIPS_TAKE=1 \
          SIMCTL_CHILD_UITEST_OPEN_URL="overland://clips/test-clip" \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          # The hook holds the take paused for 12s after this line, so the bar is on screen.
          for _ in $(seq 1 40); do
            tail -n +$((TAKE_LOG_BEFORE + 1)) /tmp/app.log | grep -q "UITEST_CLIPS_TAKE_PLAYING" && break
            sleep 1
          done
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/clips-take-screen.png" || true
          for _ in $(seq 1 30); do
            tail -n +$((TAKE_LOG_BEFORE + 1)) /tmp/app.log | grep -q "UITEST_CLIPS_TAKE_BACK onTake" && break
            sleep 1
          done
          sleep 1
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/clips-take-back-screen.png" || true
          TAKE_LOG=$(tail -n +$((TAKE_LOG_BEFORE + 1)) /tmp/app.log | grep "UITEST_CLIPS_TAKE_\|clips:" || true)
          echo "$TAKE_LOG"
          # Logged, not asserted: a runner may have no audio input. See -runTakeTest.
          # rate=1.25 below: the Clips step before this one saved that speed for test-clip.
          echo "$TAKE_LOG" | grep -q "UITEST_CLIPS_TAKE_RECORDED" || { echo "FAIL: the take test never reached the end of recording"; exit 1; }
          echo "$TAKE_LOG" | grep "UITEST_CLIPS_TAKE_SAVED" | grep -q "takes=1.*mapPoints=41" || { echo "FAIL: the take was not saved with the server's map"; exit 1; }
          grep -q "POST /clips/test-clip/align auth=Bearer" /tmp/received.log || { echo "FAIL: mock never received the take"; exit 1; }
          echo "$TAKE_LOG" | grep "UITEST_CLIPS_TAKE_PLAYING" | grep -q "onTake=1 rate=1.25.*barHidden=0" || { echo "FAIL: the take was not playing with the bar showing"; exit 1; }
          echo "$TAKE_LOG" | grep -q "UITEST_CLIPS_TAKE_BACK onTake=0 rate=1.25.*barHidden=1" || { echo "FAIL: Back to song did not resume the song"; exit 1; }
          PAUSED_T=$(echo "$TAKE_LOG" | sed -n "s/.*UITEST_CLIPS_TAKE_BACK_PAUSED.*rate=0.00 time=\([0-9.]*\).*/\1/p")
          awk -v t="${PAUSED_T:-0}" 'BEGIN { exit !(t >= 8 && t <= 9.5) }' || { echo "FAIL: Back to song from a paused take reached '$PAUSED_T', expected about 8.7"; exit 1; }
          BACK_T=$(echo "$TAKE_LOG" | sed -n "s/.*UITEST_CLIPS_TAKE_BACK onTake.* time=\([0-9.]*\).*/\1/p")
          # About 3.7s into the take maps to song 8.7, then 2s at 1.25x.
          awk -v t="$BACK_T" 'BEGIN { exit !(t >= 8.5 && t <= 12) }' || { echo "FAIL: Back to song reached $BACK_T, expected about 10"; exit 1; }
          echo "PASS: take recorded, placed, played, and Back to song reached $BACK_T"

          # Section link with no loop hook (the loop re-seeks and hid this bug): the
          # playhead must start at the section, here b, nudged to 6.5 by the first step.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          LINK_LOG_BEFORE=$(wc -l < /tmp/app.log)
          SIMCTL_CHILD_UITEST_CLIPS_BASE_URL="http://127.0.0.1:${MOCK_PORT}/" \
          SIMCTL_CHILD_UITEST_OPEN_URL="overland://clips/test-clip?section=b" \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          for _ in $(seq 1 30); do
            tail -n +$((LINK_LOG_BEFORE + 1)) /tmp/app.log | grep -q "UITEST_CLIPS_OPENED" && break
            sleep 1
          done
          LINK_LINE=$(tail -n +$((LINK_LOG_BEFORE + 1)) /tmp/app.log | grep "UITEST_CLIPS_OPENED" | tail -1 || true)
          echo "link: $LINK_LINE"
          LINK_T=$(echo "$LINK_LINE" | sed -n "s/.* time=\([0-9.]*\).*/\1/p")
          awk -v t="${LINK_T:-0}" 'BEGIN { exit !(t >= 6.4 && t <= 8.5) }' || { echo "FAIL: section link started at ${LINK_T:-none}, expected about 6.5"; exit 1; }
          echo "PASS: section link started at $LINK_T"

          # Let it play on, kill it, and come back by tapping the Clips tile: the
          # player must reopen by itself at the saved spot without playing.
          sleep 6
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          RESUME_LOG_BEFORE=$(wc -l < /tmp/app.log)
          SIMCTL_CHILD_UITEST_CLIPS_BASE_URL="http://127.0.0.1:${MOCK_PORT}/" \
          SIMCTL_CHILD_UITEST_MORE_TILE_TAP="GLModule.ClipsModule" \
          SIMCTL_CHILD_UITEST_TAB=more \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          for _ in $(seq 1 30); do
            tail -n +$((RESUME_LOG_BEFORE + 1)) /tmp/app.log | grep -q "UITEST_CLIPS_OPENED" && break
            sleep 1
          done
          sleep 1
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/clips-resume-screen.png" || true
          RESUME_LINE=$(tail -n +$((RESUME_LOG_BEFORE + 1)) /tmp/app.log | grep "UITEST_CLIPS_OPENED" | tail -1 || true)
          echo "resume: $RESUME_LINE"
          R_SAVED=$(echo "$RESUME_LINE" | sed -n "s/.*saved=\([0-9.]*\).*/\1/p")
          R_T=$(echo "$RESUME_LINE" | sed -n "s/.* time=\([0-9.]*\).*/\1/p")
          echo "$RESUME_LINE" | grep -q "wantsPlay=0" || { echo "FAIL: the reopened clip should wait paused"; exit 1; }
          # The link step played from 6.5 for over 6s at 1.25x; a save of 0 would pass a bare time check.
          awk -v s="${R_SAVED:-0}" -v t="${R_T:-0}" 'BEGIN { exit !(s >= 10 && t >= s - 0.2 && t <= s + 0.2) }' || { echo "FAIL: reopened at ${R_T:-none}, saved ${R_SAVED:-none}"; exit 1; }
          echo "PASS: reopened paused at $R_T after a restart"

          # Voice: the real save path from a transcript (the mic itself needs a device),
          # then the score viewer on the PDF the tab downloaded from the mock.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          VOICE_LOG_BEFORE=$(wc -l < /tmp/app.log)
          SIMCTL_CHILD_UITEST_CLIPS_BASE_URL="http://127.0.0.1:${MOCK_PORT}/" \
          SIMCTL_CHILD_UITEST_CLIPS_VOICE="at 0:05 voice left hand|in the coda voice slower|new section storm at 0:08|this section is called gale" \
          SIMCTL_CHILD_UITEST_CLIPS_SCORE=1 \
          SIMCTL_CHILD_UITEST_OPEN_URL="overland://clips/test-clip" \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          for _ in $(seq 1 40); do
            tail -n +$((VOICE_LOG_BEFORE + 1)) /tmp/app.log | grep -q "UITEST_CLIPS_SCORE" && break
            sleep 1
          done
          sleep 1
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/clips-score-screen.png" || true
          VOICE_LINE=$(tail -n +$((VOICE_LOG_BEFORE + 1)) /tmp/app.log | grep "UITEST_CLIPS_VOICE" | tail -1 || true)
          SCORE_LINE=$(tail -n +$((VOICE_LOG_BEFORE + 1)) /tmp/app.log | grep "UITEST_CLIPS_SCORE" | tail -1 || true)
          echo "voice: $VOICE_LINE"; echo "score: $SCORE_LINE"
          case "$VOICE_LINE" in
            *"noteTimes="*"5"*"22"*"B: Middle@6-8"*"Storm@8-11"*) echo "PASS: spoken note times and new section saved" ;;
            *) echo "FAIL: spoken notes or section not saved as said"; exit 1 ;;
          esac
          case "$VOICE_LINE" in
            *"Gale@"*) echo "PASS: spoken rename saved" ;;
            *) echo "FAIL: spoken rename not saved"; exit 1 ;;
          esac
          # The outbox sends one item at a time, so give the queue time to drain. -a because
          # the take upload put m4a bytes in this log, and grep hides matches in a binary file.
          for _ in $(seq 1 30); do
            grep -a -A1 "POST /clips/test-clip/notes auth=Bearer" /tmp/received.log | grep -q "Voice slower" \
              && grep -a -A1 "POST /clips/test-clip/sections auth=Bearer" /tmp/received.log | grep -q "Storm" && break
            sleep 1
          done
          grep -a -A1 "POST /clips/test-clip/notes auth=Bearer" /tmp/received.log | grep -q "Voice slower" || { echo "FAIL: mock never received the spoken note"; tail -20 /tmp/received.log; exit 1; }
          grep -a -A1 "POST /clips/test-clip/sections auth=Bearer" /tmp/received.log | grep -q "Storm" || { echo "FAIL: mock never received the spoken section"; tail -20 /tmp/received.log; exit 1; }
          echo "PASS: spoken note and section reached the server"
          case "$SCORE_LINE" in
            *"pages=2"*) echo "PASS: score viewer opened the downloaded PDF" ;;
            *) echo "FAIL: expected score viewer with pages=2"; exit 1 ;;
          esac

          # Don't leak the Sessions steps' persisted mock API base into the
          # steps below, so they see the same web-page boot state as on main.
          xcrun simctl spawn "$SIM_UDID" defaults delete "$BUNDLE_ID" AssistantUITestWebPageAPIBase || true

          # The native palette normally comes from the theme server on 8304,
          # but sim-test never bakes GL_BAKED_HOST, so that fetch always fails
          # in CI and GLTheme falls back to the asset colours. Every shot above
          # therefore shows the FALLBACK, and proves nothing about whether a
          # selected theme reaches the native chrome. Inject the palette
          # directly (UITEST_NATIVE_PALETTE, one already-variant-resolved leaf
          # of design-tokens/native-theme.json) so these shots exercise the
          # real palette path.
          #
          # BOTH variants, deliberately. This block used to inject dusk-DARK
          # only, so every "the shell is themed" claim ever made off these
          # screenshots was about a variant Oliver's device does not render:
          # his phone resolves dusk-LIGHT. That gradient runs from warm peach
          # at the top to cool blue at the bottom, i.e. its far end is exactly
          # where the tab bar sits, which is the seam the dark-only shots
          # could never show. A suite that can only see one variant cannot
          # catch that class of bug, so the palette leaf and the appearance
          # mode are set together here and each variant gets its own shot.
          # GLThemeModeDefaults: 1=Light, 2=Dark, see Shared/GLTheme.h. The
          # appearance sweep below re-writes that default at the top of each
          # of its own passes, so leaving it set here cannot leak into it.
          # dusk.light / dusk.dark are read at RUN TIME from
          # design-tokens/native-theme.json, committed IN THIS REPO --
          # deliberately not a hardcoded literal here, and this is the
          # second time that choice has been made: a prior version of this
          # block DID hand-type the leaf as a literal, and it silently went
          # stale the moment the generator started emitting
          # surface-translucent/backdrop-blur -- every dusk screenshot after
          # that kept "working" while proving nothing about the app's real
          # glass-tile rendering, because the palette this harness injected
          # never carried those keys. A literal can drift again the same way
          # no matter how carefully it's retyped once; reading the file
          # can't.
          #
          # Why a checked-in COPY instead of checking out the real generator:
          # native-theme.json is generated by design-tokens/build.mjs in the
          # sibling `assistant` repo, which is PRIVATE and is not (and
          # should not become) a checkout this workflow adds -- that would
          # mean a cross-repo PAT secret for a CI job whose whole design
          # point is to stay cheap and disposable (see MODULES.md's CI
          # budget section). A copy committed here is the option that needs
          # no new credentials and still ends the "read from a live literal"
          # failure mode. The copy's own staleness is checked separately,
          # by hand/by an agent, not by this job (which has no way to reach
          # the private repo either): scripts/check_palette_sync.sh diffs it
          # against the generator's real output given a local checkout of
          # `assistant`.
          #
          # jq is preinstalled on macOS runners. Fails the job loudly (not a
          # silent literal fallback) if the file or either leaf is missing.
          DUSK_PALETTE_FILE="$GITHUB_WORKSPACE/design-tokens/native-theme.json"
          if [ ! -s "$DUSK_PALETTE_FILE" ]; then
            echo "FATAL: $DUSK_PALETTE_FILE is missing or empty -- this is the committed copy of design-tokens/native-theme.json the dusk shots inject; see scripts/check_palette_sync.sh"
            exit 1
          fi
          DUSK_LIGHT=$(jq -c '.dusk.light // empty' "$DUSK_PALETTE_FILE")
          DUSK_DARK=$(jq -c '.dusk.dark // empty' "$DUSK_PALETTE_FILE")
          if [ -z "$DUSK_LIGHT" ] || [ -z "$DUSK_DARK" ]; then
            echo "FATAL: $DUSK_PALETTE_FILE has no .dusk.light/.dusk.dark leaf -- got DUSK_LIGHT='$DUSK_LIGHT' DUSK_DARK='$DUSK_DARK'"
            exit 1
          fi
          echo "dusk.light keys: $(echo "$DUSK_LIGHT" | jq -r 'keys | sort | join(",")')"
          echo "dusk.dark keys: $(echo "$DUSK_DARK" | jq -r 'keys | sort | join(",")')"

          # Journal's tab index is DERIVED from TAB_ENTRIES below, never
          # written out here. It has moved three times now (4 -> 5 when Growth
          # was added; back to 4 when Events' +moduleOrder moved it to the end
          # of the More grid; 4 -> 7 when Settings moved ahead of it), and a
          # hardcoded copy went stale on every one of those -- run 33288060109
          # screenshotted Events under this filename before the index was
          # corrected once already. Deriving it means the next reorder cannot
          # silently point this shot at the wrong module. Journal's
          # own cards and controls read the same GLTheme tokens as the shell,
          # so it is the shot that shows a MODULE, not just the chrome, under
          # a real palette.
          for DUSK_VARIANT in light dark; do
            if [ "$DUSK_VARIANT" = light ]; then
              DUSK_PALETTE="$DUSK_LIGHT"
              DUSK_MODE=1
            else
              DUSK_PALETTE="$DUSK_DARK"
              DUSK_MODE=2
            fi
            xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLThemeModeDefaults -int "$DUSK_MODE"
            JOURNAL_TAB=""
            for TAB_ENTRY in "${TAB_ENTRIES[@]}"; do
              set -- $TAB_ENTRY
              if [ "$2" = journal ]; then JOURNAL_TAB=$1; fi
            done
            if [ -z "$JOURNAL_TAB" ]; then
              echo "MISS: no 'journal' entry in TAB_ENTRIES -- cannot pick the dusk module shot"; exit 1
            fi
            for DUSK_TARGET in "more more" "$JOURNAL_TAB journal"; do
              set -- $DUSK_TARGET
              DUSK_TAB=$1
              DUSK_NAME=$2
              DUSK_SHOT="$GITHUB_WORKSPACE/${DUSK_NAME}-dusk-${DUSK_VARIANT}-screen.png"
              xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
              sleep 1
              # UITEST_DUMP_PALETTE_KEYS only for the "more" target: that's
              # the one dusk target with a web page to read window.GL_BOOT
              # back from (Journal is a native UIKit screen -- see
              # SceneDelegate.m's own comment on the hook). Empty string, not
              # unset, for journal: SceneDelegate checks `.length > 0`
              # specifically so this can stay unconditional here.
              DUSK_PALETTE_KEYS_HOOK=""
              if [ "$DUSK_NAME" = more ]; then
                DUSK_PALETTE_KEYS_HOOK=1
              fi
              SIMCTL_CHILD_UITEST_TAB=$DUSK_TAB \
                SIMCTL_CHILD_UITEST_NATIVE_PALETTE="$DUSK_PALETTE" \
                SIMCTL_CHILD_UITEST_DUMP_PALETTE_KEYS="$DUSK_PALETTE_KEYS_HOOK" \
                xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
              wait_for_app_process || true
              sleep 4
              xcrun simctl io "$SIM_UDID" screenshot "$DUSK_SHOT" || true
              SOFT_HOME_SCREEN_MISS=0
              # "more" gets soft mode -- see check_not_home_screen's own
              # comment above for why, and the tie-breaker against the
              # tile-lightness assertion right below. "journal" is a native
              # screen with no per-pixel tile check to fall back on, so it
              # stays strict.
              if [ "$DUSK_NAME" = more ]; then
                check_not_home_screen "$DUSK_SHOT" "${DUSK_NAME}-dusk-${DUSK_VARIANT}" soft
              else
                check_not_home_screen "$DUSK_SHOT" "${DUSK_NAME}-dusk-${DUSK_VARIANT}"
              fi

              if [ "$DUSK_NAME" = more ]; then
                # Assertion 1: the PAGE actually received the keys we
                # injected (GLModuleRegistry's
                # +logPaletteKeysReceivedByMoreScreen, via
                # UITEST_DUMP_PALETTE_KEYS above), not just that the env var
                # was set. `tail -1`: app.log is one continuous stream across
                # every relaunch in this job, so the freshest line is this
                # launch's.
                DUSK_KEYS_LINE=$(grep "UITEST_PALETTE_KEYS:" /tmp/app.log | tail -1 || true)
                echo "palette-keys(${DUSK_NAME}-dusk-${DUSK_VARIANT}): ${DUSK_KEYS_LINE:-<no UITEST_PALETTE_KEYS line at all>}"
                if [ -z "$DUSK_KEYS_LINE" ]; then
                  echo "MISS: no UITEST_PALETTE_KEYS log line for more-dusk-${DUSK_VARIANT} -- the page never reported back what window.GL_BOOT.palette held"
                  FAIL=1
                elif echo "$DUSK_PALETTE" | jq -e 'has("surface-translucent")' >/dev/null \
                     && ! echo "$DUSK_KEYS_LINE" | grep -q "surface-translucent"; then
                  echo "MISS: injected dusk-${DUSK_VARIANT} palette has surface-translucent but the page's own window.GL_BOOT.palette did not report it back ($DUSK_KEYS_LINE)"
                  FAIL=1
                fi

                # Assertion 2: the rendered SCREENSHOT actually shows glass,
                # not just that the palette round-tripped in JS -- the two
                # can diverge if the CSS/JS that consumes the key breaks
                # independently of the injection path. Only meaningful when
                # the injected leaf carries surface-translucent at all.
                #
                # LIGHT variant only. It used to run for dark too, on the
                # same >10 threshold -- run 33538866789 measured light's
                # real top/next-row delta at 13 (comfortably above 10) but
                # dark's at 8 (comfortably BELOW it), on a screenshot proven
                # byte-for-byte identical to the pre-existing, Oliver-approved
                # dark render (see check_dusk_tile_lightness.py's dark band,
                # which pinned that same screenshot to within 2.5 points of
                # its known-good 23.7%). The 10-point threshold was derived
                # from LIGHT's own gradient span (see
                # check_dusk_tile_translucency.py's header) and was never
                # re-derived for dark's -- which is genuinely smaller, not
                # broken. Lowering it to clear dark's 8 would leave almost no
                # margin against the very "flat opaque tile" bug this check
                # exists to catch (that bug reads ~0, only 8 points below
                # dark's real value). Dark's "must stay pixel-identical"
                # requirement is already covered, precisely, by the lightness
                # check below (+/-2.5 points of a pinned value) -- that is
                # the guard for dark, this one is for light.
                if [ "$DUSK_VARIANT" = light ] && echo "$DUSK_PALETTE" | jq -e 'has("surface-translucent")' >/dev/null; then
                  TRANSLUCENCY_OUT=$(python3 scripts/check_dusk_tile_translucency.py "$DUSK_SHOT" 2>&1) || true
                  echo "translucency(${DUSK_NAME}-dusk-${DUSK_VARIANT}): $TRANSLUCENCY_OUT"
                  case "$TRANSLUCENCY_OUT" in
                    MISS:*) FAIL=1 ;;
                    ERROR:*) echo "WARN: could not run the tile-translucency guard: $TRANSLUCENCY_OUT" ;;
                  esac
                fi

                # Assertion 3: the tile actually reads as LIGHT/DARK the way
                # Oliver's real complaint was about, not just that it tracks
                # the gradient (assertion 2 above already passed on the
                # pre-fix code, twice, while the tile still looked like a
                # "shitty white background" -- a mechanism check is not the
                # same claim as a visual one). Runs for both variants,
                # unconditionally -- unlike assertion 2 it does not need the
                # injected palette to carry surface-translucent, since its
                # dark-variant check exists specifically to catch a
                # regression AWAY from "no change at all" even if some
                # future edit stopped emitting the glass keys entirely.
                LIGHTNESS_OUT=$(python3 scripts/check_dusk_tile_lightness.py "$DUSK_SHOT" "$DUSK_VARIANT" 2>&1) || true
                echo "lightness(${DUSK_NAME}-dusk-${DUSK_VARIANT}): $LIGHTNESS_OUT"
                case "$LIGHTNESS_OUT" in
                  MISS:*) FAIL=1 ;;
                  ERROR:*) echo "WARN: could not run the tile-lightness guard: $LIGHTNESS_OUT" ;;
                esac

                # Tie-breaker for the soft home-screen check above: it only
                # withheld FAIL, it didn't clear it. If the whole-frame diff
                # looked like the home screen, this specific screenshot needs
                # SOME real proof the More grid rendered -- the tile-lightness
                # read is that proof (it found the expected colour AT the
                # expected coordinates, which a genuinely-stuck-on-springboard
                # capture cannot coincidentally satisfy alongside also
                # producing the UITEST_PALETTE_KEYS line asserted above, which
                # requires a real JS eval on a loaded page). Only promote to a
                # real failure if that proof is ALSO missing.
                if [ "$SOFT_HOME_SCREEN_MISS" = 1 ]; then
                  case "$LIGHTNESS_OUT" in
                    MISS:*|ERROR:*)
                      echo "MISS: ${DUSK_NAME}-dusk-${DUSK_VARIANT} screenshot looked like the home screen (whole-frame diff below the floor) AND the tile-lightness probe could not independently confirm the More grid rendered -- treating as a real launch failure"
                      FAIL=1
                      ;;
                    *)
                      echo "compare(${DUSK_NAME}-dusk-${DUSK_VARIANT}): whole-frame diff was below the home-screen floor, but the tile-lightness probe found the expected tile colour at the expected coordinates -- that's the stronger, per-pixel proof the More grid rendered, not a launch failure"
                      ;;
                  esac
                fi
              fi
            done
          done

          kill $MOCK_PID $LOG_PID 2>/dev/null || true
          cp /tmp/app.log "$GITHUB_WORKSPACE/app.log" 2>/dev/null || true

          echo "=== uncaught-exception lines in app.log (if any) ==="
          grep -iE "uncaught exception|NSInvalidArgumentException|NSInternalInconsistencyException|Terminating app" /tmp/app.log || echo "(none found in the log-stream capture)"

          echo "=== GLWebBridge openModule + tile-tap end-to-end lines ==="
          grep -E "GLWebBridge: openModule|tapMoreGridTileWithIdentifier|UITEST_MORE_TILE" /tmp/app.log || echo "(none -- the web-tap hook never reached these log lines)"

          # Appearance sweep: force Light and Dark (GLThemeModeDefaults, see
          # Shared/GLTheme.h — 1=Light, 2=Dark) and re-screenshot every tab
          # under each, so a hardcoded (non-adaptive) colour shows up as a
          # wrong-looking screenshot in one of the two passes.
          for PASS in "2 dark" "1 light"; do
            set -- $PASS
            MODE_INT=$1
            MODE_NAME=$2
            xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLThemeModeDefaults -int "$MODE_INT"
            for TAB_ENTRY in "${TAB_ENTRIES[@]}"; do
              set -- $TAB_ENTRY
              TAB_INDEX=$1
              TAB_NAME=$2
              xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
              sleep 1
              SIMCTL_CHILD_UITEST_TAB=$TAB_INDEX xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
              wait_for_app_process || true
              sleep 4
              xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/${TAB_NAME}-screen-${MODE_NAME}.png" || true
              check_not_home_screen "$GITHUB_WORKSPACE/${TAB_NAME}-screen-${MODE_NAME}.png" "${TAB_NAME}-${MODE_NAME}"
            done
          done

          # System-mode pass, against a DARK simulator: the bug this whole
          # workflow exists to catch (a cold launch in System mode on a dark
          # device building its tab/nav bar chrome from the LIGHT palette
          # variant, because +applyChromeAppearance ran once before any
          # window existed to resolve light/dark against) can ONLY be
          # exercised through GLThemeModeSystem. The two passes just above
          # can never reach it: both write an EXPLICIT GLThemeModeDefaults
          # (1=Light, 2=Dark, see Shared/GLTheme.h), and +effectiveModeName
          # returns at its first two lines whenever the persisted mode is
          # explicit, never even reaching the System-resolution branch. A
          # green run on this file before this pass existed proved nothing
          # about that branch.
          #
          # No pixel check here -- CI's simulator runtime is iOS 26, where
          # (measured on this branch) the tab bar ignores
          # UITabBarAppearance.backgroundColor outright, so a screenshot
          # can't distinguish the fixed chrome from the broken one on this
          # runtime even when the app is doing the right thing. The signal
          # instead is +applyChromeAppearance's own GLLog line (added
          # alongside this pass -- see Shared/GLTheme.m), which records the
          # actual mode name it resolved every time it runs.
          xcrun simctl ui "$SIM_UDID" appearance dark
          # 0 = GLThemeModeSystem, per the GLThemeMode enum in Shared/GLTheme.h
          # (System=0, Light=1, Dark=2) -- read from that header, not assumed,
          # because the two explicit values above are 1/2, not 0/1.
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLThemeModeDefaults -int 0
          # Fresh log capture for this pass, to its own file — same reason the
          # "Default tab" step below starts one: the main step's `log stream`
          # is killed further up (right after app.log is copied to the
          # artifact), long before this pass runs. Run 33575549681 proved it
          # the hard way — that capture died at 00:39:56 and this pass
          # launched at 00:43, so every line it wanted to assert on was
          # dropped and the vacuous-pass guard below fired instead of a real
          # verdict. A dedicated file also removes the need to offset into a
          # shared stream: everything in here belongs to this pass by
          # construction.
          xcrun simctl spawn "$SIM_UDID" log stream --level debug --style compact \
            --predicate 'process == "Overland"' > /tmp/systemmode.log 2>&1 &
          SYSTEM_LOG_PID=$!
          sleep 2
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/system-dark-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/system-dark-screen.png" "system-dark"
          # Restore the simulator's UI appearance. Checked, not assumed:
          # nothing after this point in the job ever leaves GLThemeModeDefaults
          # unset again (the "Default tab" step below never touches theme mode
          # at all, and it's the only step left that runs after this one), so
          # no later assertion actually depends on the device-level appearance
          # -- but leaving a CI runner's simulator in dark mode past this job
          # for no reason is the kind of stray state that bites a future step.
          #
          # That restore is ALSO a live dark->light flip under the running app
          # -- the same thing the device does at sunrise/sunset with automatic
          # appearance. Split the log at the flip: the launch half keeps the
          # cold-launch assertion below; the post-flip half must show the chrome
          # rebuilt from the new variant (SceneDelegate's trait-change hook).
          # Without it the bars stay dark-built until something unrelated
          # re-applies them.
          sleep 2
          LAUNCH_LINES=$(wc -l < /tmp/systemmode.log)
          xcrun simctl ui "$SIM_UDID" appearance light
          # Flush margin before killing the stream: `log stream` buffers, and
          # the lines this pass asserts on are the whole point of the pass.
          sleep 4
          kill $SYSTEM_LOG_PID 2>/dev/null || true
          cp /tmp/systemmode.log "$GITHUB_WORKSPACE/systemmode.log" 2>/dev/null || true
          SYSTEM_PASS_LOG=$(head -n "$LAUNCH_LINES" /tmp/systemmode.log)
          SYSTEM_FLIP_LOG=$(tail -n +"$((LAUNCH_LINES + 1))" /tmp/systemmode.log)
          echo "$SYSTEM_FLIP_LOG" | grep -E "window appearance changed|applyChromeAppearance resolved" || true
          if echo "$SYSTEM_FLIP_LOG" | grep -q "GLTheme: applyChromeAppearance resolved light"; then
            echo "OK: live dark->light flip in System mode rebuilt the chrome from the light variant"
          else
            echo "MISS: live dark->light flip in System mode never rebuilt the chrome -- tab bar stays on the old variant until an unrelated re-apply"
            FAIL=1
          fi
          if ! echo "$SYSTEM_PASS_LOG" | grep -q "GLTheme: applyChromeAppearance resolved"; then
            echo "MISS: System-mode dark launch never logged an applyChromeAppearance resolution at all -- can't tell pass from fail"
            FAIL=1
          else
            # Assert on the LAST resolution of the launch, not on every one.
            # That is the real guarantee: whatever variant the final call
            # resolved is the one the chrome is actually left built from, and
            # it happens in SceneDelegate's -scene:willConnectToSession:
            # before any of this app's UI is on screen. Under the original bug
            # (chrome applied only from AppDelegate, with no window to resolve
            # against) the last -- and only -- line reads "light", so this
            # still fails exactly when it should.
            #
            # Deliberately NOT "no line may say light". AppDelegate's call
            # runs before any window exists and seeds from
            # UITraitCollection.currentTraitCollection; if that is not yet
            # dark this early in the process on some runtime, that call logs
            # "light" and is then harmlessly superseded. Failing on it would
            # go red for an app that is behaving correctly, so it is a WARN
            # that reports the fact rather than a MISS -- and the warn text is
            # how this run tells us whether the early seed works at all,
            # without spending a second metered dispatch to find out.
            echo "$SYSTEM_PASS_LOG" | grep "GLTheme: applyChromeAppearance resolved"
            SYSTEM_PASS_LAST=$(echo "$SYSTEM_PASS_LOG" | grep "GLTheme: applyChromeAppearance resolved" | tail -n 1)
            case "$SYSTEM_PASS_LAST" in
              *"resolved dark"*)
                echo "OK: System mode on a dark simulator left the chrome resolved dark"
                ;;
              *)
                echo "MISS: System mode on a dark simulator left the chrome resolved to the LIGHT palette variant -- this is the cold-launch bug this pass exists to catch"
                FAIL=1
                ;;
            esac
            if echo "$SYSTEM_PASS_LOG" | grep -q "GLTheme: applyChromeAppearance resolved light"; then
              echo "WARN: an applyChromeAppearance call resolved light before the final one -- UITraitCollection.currentTraitCollection is not dark yet at AppDelegate time on this runtime. Harmless (SceneDelegate re-applies before any UI shows), but it means the pre-window seed in +effectiveModeName is not doing anything here."
            fi
          fi

          # PASS criteria. The mode assertion names the mode we actually ship
          # (significant-change) rather than "some mode started", because the
          # previous version grepped for the old default's log line and so went
          # red when the default changed while the app was working fine.
          #
          # A real coordinate reaching the endpoint is REQUIRED, not a bonus.
          # It was demoted to best-effort when simctl injection looked flaky,
          # which left the suite unable to fail for the one thing that matters.
          # If it does turn out to flake, say so and re-scope it deliberately —
          # do not quietly downgrade it again.
          grep -q "Location Authorization Status Always" /tmp/app.log || { echo "MISS: Always authorization"; FAIL=1; }
          grep -q "Monitoring significant location changes" /tmp/app.log || { echo "MISS: did not start in significant-change mode"; FAIL=1; }
          grep -q 'coordinates' /tmp/received.log || { echo "MISS: no location reached the endpoint"; FAIL=1; }
          # The stored token must actually reach the wire. Everything else here
          # can be green while the app posts unauthenticated, which is what the
          # real server was rejecting with 401 auth=none.
          grep -q 'auth=Bearer' /tmp/received.log || { echo "MISS: request carried no Bearer Authorization header"; FAIL=1; }
          # The whole tab bar is assembled at runtime from the GLModule
          # conformers, so a module that fails to register leaves the bar
          # quietly short a tab with nothing else going red. Assert the exact
          # roster, not just the count — a wrong ORDER is also a regression.
          grep -q "Module registry: installed 16 tabs: New Session, Events, Todos, Football, Settings, Finances, Journal, Esme, Growth, Outfits, Upload, Tracker, Continue?, Sleep, Debate, Clips" /tmp/app.log || {
            echo "MISS: module registry did not install the expected tabs";
            grep -i "Module registry" /tmp/app.log || echo "(no registry log line at all)";
            FAIL=1;
          }
          # The launch-hook fan-out (moduleDidFinishLaunchingWithOptions:) has
          # no other visible signal — if a module's hook were ever renamed out
          # from under the registry's respondsToSelector: check, launch setup
          # would silently stop firing while the tab still appeared. Assert
          # the exact roster of modules that responded, same as tab install.
          # Esme joins Tracker here (its daily 21:00 notification scheduling
          # -- see EsmeModule.m), sorted by +moduleOrder ascending (Esme 650,
          # Tracker 700) same as everything else the registry orders. Unlike
          # the installed-tabs line above, this one logs NSStringFromClass(),
          # i.e. the actual class name ("EsmeModule"/"TrackerModule"), not
          # +moduleTitle -- see GLModuleRegistry.m's
          # +notifyModulesDidFinishLaunchingWithOptions:.
          grep -q "Module registry: launch hooks fired for 2 modules: EsmeModule, TrackerModule" /tmp/app.log || {
            echo "MISS: module registry launch-hook fan-out did not fire for the expected modules";
            grep -i "Module registry" /tmp/app.log || echo "(no registry log line at all)";
            FAIL=1;
          }

          if [ $FAIL -eq 0 ]; then
            echo "PASS: app launches, authorizes Always, and starts tracking to the configured endpoint"
          else
            echo "FAIL: a core smoke-test signal was missing"; exit 1
          fi

      - name: Collect simulator crash reports
        # always(): must run even when the step above exited 1 -- that's the
        # whole point, since a crashing tile tap fails that step and this is
        # what explains why. CrashReporter runs on the macOS HOST watching the
        # simulated process like any other local process, so an
        # uncaught-exception SIGABRT lands in the host's own
        # DiagnosticReports directory, not anywhere inside the simulator's
        # filesystem.
        if: always()
        run: |
          set -x
          mkdir -p "$GITHUB_WORKSPACE/crash-reports"
          find ~/Library/Logs/DiagnosticReports ~/Library/Logs/DiagnosticReports/Retired \
            -iname "Overland*.ips" -exec cp {} "$GITHUB_WORKSPACE/crash-reports/" \; 2>/dev/null || true
          echo "=== crash reports found ==="
          ls -la "$GITHUB_WORKSPACE/crash-reports" 2>/dev/null || true
          CRASHED=0
          for f in "$GITHUB_WORKSPACE"/crash-reports/*.ips; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            cat "$f"
            CRASHED=1
          done
          # A crashing tile tap already fails the smoke-test step above via
          # its own missed-signal checks, but that step can't see .ips files
          # at all (macOS host-side CrashReporter output, not app.log) — a
          # crash the smoke-test step's grep checks happen not to notice
          # (e.g. one that lands after the last asserted log line) would
          # otherwise go green. Fail here explicitly so ANY simulator crash
          # during this run fails the job, independent of what the smoke
          # test happened to be checking for.
          if [ $CRASHED -eq 1 ]; then
            echo "FAIL: the simulator produced a crash report during this run (see above)"
            exit 1
          fi

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: crash-reports/
          if-no-files-found: ignore

      - name: "Default tab: cold launch, resume, and negative-resume"
        run: |
          set -x
          FAIL=0
          HOME_REF="$GITHUB_WORKSPACE/home-reference.png"

          # Same not-home-screen guard as the main step above -- redefined
          # here since bash functions/vars don't persist across steps.
          check_not_home_screen() {
            local shot="$1" label="$2"
            if [ ! -s "$shot" ]; then
              echo "MISS: $label screenshot missing or empty ($shot)"; FAIL=1; return
            fi
            local out pct_int
            out=$(python3 scripts/screenshot_diff_pct.py "$HOME_REF" "$shot" 2>&1) || true
            if [[ ! "$out" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "WARN: could not compare $label to the home-screen reference: $out"
              return
            fi
            echo "compare($label): ${out}% of pixels differ from the home screen"
            pct_int=${out%.*}
            if [ "$pct_int" -lt 50 ]; then
              if [ "${HOME_REF_OK:-0}" -ne 1 ]; then
                echo "WARN: $label differs from the home reference by only ${out}%, but that reference was too dark to judge against — not failing"
              else
                echo "MISS: $label screenshot looks like the home screen, not the app (only ${out}% of pixels differ from the pre-launch reference)"
                FAIL=1
              fi
            fi
          }

          wait_for_app_process() {
            local waited=0
            while [ "$waited" -lt 15 ]; do
              if xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
                return 0
              fi
              sleep 1
              waited=$((waited + 1))
            done
            echo "WARN: $BUNDLE_ID did not show up in launchctl list within ${waited}s"
            return 1
          }

          # First field of the matching launchctl-list line is the pid.
          get_pid() {
            xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep "$BUNDLE_ID" | awk '{print $1}' | head -1
          }

          # Fresh log capture for this step: the main step's `log stream` was
          # already killed above and its output already uploaded as app.log.
          xcrun simctl spawn "$SIM_UDID" log stream --level debug --style compact \
            --predicate 'process == "Overland"' > /tmp/defaulttab.log 2>&1 &
          DT_LOG_PID=$!
          sleep 2

          # Growth (index 8) is a More-grid module, so "opens on Growth"
          # means the registry selected More and pushed Growth
          # (GLModuleRegistry +selectDefaultTabInTabBarController:).
          echo "=== cold launch: no UITEST_TAB set, must open on Growth ==="
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          # The cooldown start is persisted, and earlier steps launched this
          # app in the same simulator, so clear it or this cold launch is skipped.
          SIMCTL_CHILD_UITEST_RESET_DEFAULT_TAB_COOLDOWN=1 \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/growth-defaulttab-cold-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/growth-defaulttab-cold-screen.png" "growth-defaulttab-cold"
          grep -q "GLDefaultTab: cold launch -> Growth (index 8)" /tmp/defaulttab.log || {
            echo "MISS: cold launch did not open on Growth"; FAIL=1;
          }

          echo "=== resume: backgrounded past a 0s threshold must reset to Growth ==="
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          # UITEST_TAB starts this run on Football (index 3) instead, so the
          # resume path is the ONLY thing that can put it back on Growth --
          # a suite that only ever launched fresh (always UITEST_TAB unset)
          # couldn't tell "always opens on Growth" from "resume works".
          SIMCTL_CHILD_UITEST_TAB=3 SIMCTL_CHILD_UITEST_RESUME_THRESHOLD_SECONDS=0 \
            SIMCTL_CHILD_UITEST_DEFAULT_TAB_COOLDOWN_SECONDS=0 \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 4
          PID_BEFORE=$(get_pid)
          echo "pid before resume: $PID_BEFORE"
          if [ -z "$PID_BEFORE" ]; then
            echo "MISS: could not read the app's pid before backgrounding it"; FAIL=1
          fi
          # Background it (foreground Safari instead), then foreground it
          # again WITHOUT --terminate-running-process, so this exercises a
          # real resume of the SAME process rather than a fresh cold start.
          xcrun simctl launch "$SIM_UDID" com.apple.mobilesafari
          sleep 3
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 4
          PID_AFTER=$(get_pid)
          echo "pid after resume: $PID_AFTER"
          if [ -z "$PID_AFTER" ] || [ "$PID_AFTER" != "$PID_BEFORE" ]; then
            echo "MISS: pid changed across the resume ($PID_BEFORE -> $PID_AFTER) — this measured a cold start, not a resume, and proves nothing"
            FAIL=1
          fi
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/growth-defaulttab-resume-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/growth-defaulttab-resume-screen.png" "growth-defaulttab-resume"
          grep -qE "GLDefaultTab: resume after [0-9]+s -> Growth \(index 8\)" /tmp/defaulttab.log || {
            echo "MISS: resume past the threshold did not reset to Growth"; FAIL=1;
          }

          echo "=== cooldown: second resume inside the cooldown must NOT reset again ==="
          # Cooldown 20s, threshold 0. The cold launch selects Growth and starts
          # the cooldown; resume #1 happens >20s later (selects default again),
          # resume #2 a few seconds after that (inside the cooldown).
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          CD_PRE_SEL=$(grep -c "GLDefaultTab: resume after [0-9]*s -> Growth" /tmp/defaulttab.log || true)
          CD_PRE_REC=$(grep -c "GLDefaultTab: resume after [0-9]*s -> default shown recently" /tmp/defaulttab.log || true)
          SIMCTL_CHILD_UITEST_TAB=3 SIMCTL_CHILD_UITEST_RESUME_THRESHOLD_SECONDS=0 \
            SIMCTL_CHILD_UITEST_DEFAULT_TAB_COOLDOWN_SECONDS=20 \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 22
          xcrun simctl launch "$SIM_UDID" com.apple.mobilesafari
          sleep 2
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 3
          xcrun simctl launch "$SIM_UDID" com.apple.mobilesafari
          sleep 2
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 3
          CD_POST_SEL=$(grep -c "GLDefaultTab: resume after [0-9]*s -> Growth" /tmp/defaulttab.log || true)
          CD_POST_REC=$(grep -c "GLDefaultTab: resume after [0-9]*s -> default shown recently" /tmp/defaulttab.log || true)
          if [ "$CD_POST_SEL" -ne $((CD_PRE_SEL + 1)) ]; then
            echo "MISS: cooldown scenario expected exactly one resume reset to Growth ($CD_PRE_SEL -> $CD_POST_SEL)"; FAIL=1
          fi
          if [ "$CD_POST_REC" -ne $((CD_PRE_REC + 1)) ]; then
            echo "MISS: cooldown scenario expected exactly one 'default shown recently' ($CD_PRE_REC -> $CD_POST_REC)"; FAIL=1
          fi

          echo "=== journal holds: Journal on screen, backgrounded past a 0s threshold, must NOT reset ==="
          # Journal (index 6, a More-overflow module) opts out of the reset
          # via +moduleHoldsTabOnResume. The UITEST_TAB hook re-selects the tab
          # after the decision, so the log line is the proof, not the screenshot.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          PRE_HOLD=$(grep -c "GLDefaultTab: resume after [0-9]*s -> current screen holds" /tmp/defaulttab.log || true)
          PRE_SEL=$(grep -c "Module registry: default tab ->" /tmp/defaulttab.log || true)
          SIMCTL_CHILD_UITEST_TAB=6 SIMCTL_CHILD_UITEST_RESUME_THRESHOLD_SECONDS=0 \
            SIMCTL_CHILD_UITEST_DEFAULT_TAB_COOLDOWN_SECONDS=0 \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 4
          xcrun simctl launch "$SIM_UDID" com.apple.mobilesafari
          sleep 3
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 4
          POST_HOLD=$(grep -c "GLDefaultTab: resume after [0-9]*s -> current screen holds" /tmp/defaulttab.log || true)
          POST_SEL=$(grep -c "Module registry: default tab ->" /tmp/defaulttab.log || true)
          if [ "$POST_HOLD" -le "$PRE_HOLD" ]; then
            echo "MISS: resume with Journal on screen did not log 'current screen holds'"; FAIL=1
          fi
          # The cold launch of this sub-test selects Growth once (+1); a
          # resume reset would add a second.
          if [ "$POST_SEL" -gt $((PRE_SEL + 1)) ]; then
            echo "MISS: resume with Journal on screen still selected the default tab ($PRE_SEL -> $POST_SEL)"; FAIL=1
          fi

          echo "=== negative: backgrounded BELOW a 3600s threshold must keep the current tab ==="
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          SIMCTL_CHILD_UITEST_TAB=3 SIMCTL_CHILD_UITEST_RESUME_THRESHOLD_SECONDS=3600 \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/defaulttab-negative-reference-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/defaulttab-negative-reference-screen.png" "defaulttab-negative-reference"
          # Snapshot how many times the registry has selected a default tab
          # BEFORE this resume, so the assertion below is "did THIS resume
          # trigger a selection" rather than a brittle absolute count across
          # the whole step (the cold-launch and resume sub-tests above each
          # add their own lines).
          PRE_COUNT=$(grep -c "Module registry: default tab ->" /tmp/defaulttab.log || true)
          xcrun simctl launch "$SIM_UDID" com.apple.mobilesafari
          sleep 3
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/finances-defaulttab-negative-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/finances-defaulttab-negative-screen.png" "finances-defaulttab-negative"
          grep -qE "GLDefaultTab: resume after [0-9]+s -> kept current tab" /tmp/defaulttab.log || {
            echo "MISS: a short resume changed the default-tab outcome (expected 'kept current tab')"; FAIL=1;
          }
          POST_COUNT=$(grep -c "Module registry: default tab ->" /tmp/defaulttab.log || true)
          if [ "$POST_COUNT" -ne "$PRE_COUNT" ]; then
            echo "MISS: a short resume triggered a default-tab selection anyway ($PRE_COUNT -> $POST_COUNT registry selections)"
            FAIL=1
          fi
          # Pixel proof Finances is STILL selected, not just "some app
          # screen": compare against the reference taken right after this
          # sub-flow's own cold launch, same session, so nothing else
          # (theme mode, simulator state) differs between the two shots.
          SAME_OUT=$(python3 scripts/screenshot_diff_pct.py \
            "$GITHUB_WORKSPACE/defaulttab-negative-reference-screen.png" \
            "$GITHUB_WORKSPACE/finances-defaulttab-negative-screen.png" 2>&1) || true
          echo "compare(negative-resume vs its own pre-resume reference): ${SAME_OUT}% differ"
          if [[ "$SAME_OUT" =~ ^[0-9]+\.[0-9]+$ ]]; then
            SAME_INT=${SAME_OUT%.*}
            if [ "$SAME_INT" -ge 15 ]; then
              echo "MISS: negative-resume screenshot differs ${SAME_OUT}% from its own pre-resume reference — the tab appears to have changed"
              FAIL=1
            fi
          else
            echo "WARN: could not pixel-compare the negative-resume screenshot to its reference: $SAME_OUT"
          fi

          echo "=== growth-quiet-window: a review completed 60s ago must open on Todos, not Growth ==="
          # UITEST_GROWTH_REVIEWED_SECONDS_AGO is GrowthModule's own test hook
          # (read inside +isWithinQuietWindow, same spirit as
          # UITEST_RESUME_THRESHOLD_SECONDS above) -- it stands in for "a
          # review completed 60s before this cold launch", well inside the
          # 30-minute quiet window, so this proves the OTHER branch of
          # +[GrowthModule isWithinQuietWindow] from the one every earlier
          # sub-test in this step already exercises (never-reviewed /
          # long-ago -> Growth). No swipe through the real growth web app is
          # needed, and nothing is written to the simulator's defaults.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          SIMCTL_CHILD_UITEST_GROWTH_REVIEWED_SECONDS_AGO=60 \
            SIMCTL_CHILD_UITEST_RESET_DEFAULT_TAB_COOLDOWN=1 \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/growth-quietwindow-cold-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/growth-quietwindow-cold-screen.png" "growth-quietwindow-cold"
          grep -q "GLDefaultTab: cold launch -> Todos (index 2)" /tmp/defaulttab.log || {
            echo "MISS: a review 60s ago did not send cold launch to Todos"; FAIL=1;
          }

          echo "=== growth-quiet-window: a review 45 min ago is past the 30-minute window, opens Growth ==="
          # Pins the window's length, not just its existence: 45 minutes was
          # INSIDE the old 1-hour window, so this fails if it ever regrows.
          # /tmp/defaulttab.log is cumulative and earlier sub-tests already
          # logged a Growth cold launch, so count lines instead of grep -q.
          GROWTH_BEFORE=$(grep -c "GLDefaultTab: cold launch -> Growth (index 8)" /tmp/defaulttab.log || true)
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          SIMCTL_CHILD_UITEST_GROWTH_REVIEWED_SECONDS_AGO=2700 \
            SIMCTL_CHILD_UITEST_RESET_DEFAULT_TAB_COOLDOWN=1 \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 4
          GROWTH_AFTER=$(grep -c "GLDefaultTab: cold launch -> Growth (index 8)" /tmp/defaulttab.log || true)
          if [ "$GROWTH_AFTER" -le "$GROWTH_BEFORE" ]; then
            echo "MISS: a review 45 min ago did not open Growth (quiet window longer than 30 min?)"; FAIL=1
          fi

          echo "=== deep link: a Journal URL from another tab must show Journal ==="
          # Journal lives in More. Its old -selectJournalTab looked for its own
          # navigation controller in tabs.viewControllers and found nothing
          # ("navController NOT FOUND"), so the lock-screen Journal Controls
          # opened on whatever tab was current. Starting on Football (index
          # 3) means only the deep link can put Journal on screen.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          SIMCTL_CHILD_UITEST_TAB=3 SIMCTL_CHILD_UITEST_OPEN_URL="overland://journal/text" \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 5
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/journal-deeplink-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/journal-deeplink-screen.png" "journal-deeplink"
          grep -q "Module registry: show GLModule.AutoJournalModule -> shown" /tmp/defaulttab.log || {
            echo "MISS: the Journal deep link did not bring Journal on screen"; FAIL=1;
          }
          # Segment 1 = Text. An unloaded view reads 0 here (nil modeControl),
          # which is how the Text Control used to open on Voice.
          grep -q "Journal: text entry requested, mode segment 1" /tmp/defaulttab.log || {
            echo "MISS: the Journal text deep link did not switch Journal to Text mode"; FAIL=1;
          }
          if grep -q "NOT FOUND" /tmp/defaulttab.log; then
            echo "MISS: a module lookup failed during the Journal deep link"; FAIL=1
          fi

          kill $DT_LOG_PID 2>/dev/null || true
          cp /tmp/defaulttab.log "$GITHUB_WORKSPACE/defaulttab.log" 2>/dev/null || true

          if [ $FAIL -eq 0 ]; then
            echo "PASS: cold launch and a long resume both open on Growth outside the quiet window; a short resume keeps the current tab; a recent review sends cold launch to Todos; a Journal deep link shows Journal"
          else
            echo "FAIL: a default-tab signal was missing"; exit 1
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-screen
          path: |
            home-reference.png
            main-screen.png
            esme-screen.png
            todos-screen.png
            newsession-screen.png
            growth-screen.png
            events-screen.png
            finances-screen.png
            football-screen.png
            journal-screen.png
            tracker-screen.png
            settings-screen.png
            outfits-screen.png
            upload-screen.png
            continue-screen.png
