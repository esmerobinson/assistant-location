<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>More</title>
<script src="gl-bridge.js"></script>
<link rel="stylesheet" href="page.css">
<style>
  /* Margin/gutter below MUST match GLTheme's own spacingM (16) / spacingS
     (12) -- these are the exact constants the old native grid
     (GLMoreGridViewController, see git show 862d5f4) used for its outer
     margin and inter-tile gutter, and #applyTileGeometry() below re-derives
     the native "side = floor((contentWidth - gutter) / 2)" square-tile math
     from this same gutter value, so the two must never drift apart. */
  #gl-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)) 16px;
  }

  .gl-tile {
    position: relative;
    box-sizing: border-box;
    /* Glass rule, same shape as page.css's .gl-card (see its comment):
       gl-bridge.js always sets --gl-surface-translucent/--gl-backdrop-blur,
       to the real translucent value + blur on a theme that opts in (dusk)
       and to the resolved opaque --gl-surface + "none" everywhere else. Was
       `background: var(--gl-surface)`, which is what made these tiles
       opaque white slabs on dusk (the user: "the square items in the main
       view have this shitty white background") even though the web tabs'
       cards never had that problem.
       --gl-tile-fill/--gl-tile-edge (not --gl-surface-translucent/
       --gl-backdrop-blur directly) are the CURRENT rule: the glass fix
       above stopped the tile being FLAT, but dusk-light's tile still
       measured ~96% HSL lightness -- still a near-opaque white slab to the
       eye -- because dusk-light's own color.surface is 55% white. gl-bridge.js
       sets --gl-tile-fill/--gl-tile-edge from the palette's OWN
       tile-fill/tile-edge when present (currently just dusk-light, a
       dedicated barely-there-glass treatment measured ~92%), falling back
       to the exact same values --gl-surface-translucent/border:none already
       produced when absent -- so this rule reproduces today's tile,
       unchanged, on every theme except dusk-light. See
       design-tokens/tokens.json's $comment10 for the full token-choice
       rationale (a tile-scoped pair, not a `surface` change, so the web
       tabs' cards on dusk light don't move too). */
    background: var(--gl-tile-fill);
    -webkit-backdrop-filter: var(--gl-backdrop-blur);
    backdrop-filter: var(--gl-backdrop-blur);
    border-radius: 18px;
    padding: 16px;
    /* Square, sized to the column width -- see #applyTileGeometry(), which
       sets --gl-tile-side to the same "side" the old native grid computed
       and applies it as this tile's explicit height (a plain aspect-ratio
       here would size against the CONTENT box, and padding/box-sizing
       interactions made that drift off-square in practice; an explicit
       height sidesteps it entirely). */
    height: var(--gl-tile-side, 173px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* Breathing room between the icon chip and the label. Deliberately NOT
       the 12px grid gutter it started as -- Oliver asked for slightly more
       air here after seeing the tile next to five alternatives ("I like the
       original, maybe we can slightly increase the vertical spacing between
       the title and icon"). 16px = GLTheme spacingM, so it is a real token
       step rather than an arbitrary nudge, and the tile has room for it: at
       the 173px height, 16px padding + 52px chip + 16px gap + ~18px label
       leaves ~55px slack. WebPagesTests asserts that slack stays positive so
       a later bump cannot silently overflow the fixed-height tile. */
    gap: 16px;
    /* --gl-tile-edge defaults to "none" (real, valid CSS -- gl-bridge.js's
       comment on --gl-backdrop-blur's own "none" default explains why a
       real no-op value beats an unset custom property here) whenever the
       palette carries no tile-edge override, so this is a no-op border on
       every theme except dusk-light, same as the old literal `border: none`
       it replaces. */
    border: var(--gl-tile-edge);
    text-align: center;
    color: var(--gl-text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    /* No touch-action:none here: the tiles cover nearly the whole page, so
       it disabled scrolling for any swipe that started on one. A drag is
       still kept from scrolling by onTileTouchMove's preventDefault once the
       long press has fired. */
  }

  /* .gl-tile.hero -- the wide-tile shape from git show 523f431 (removed
     there, restored here), but WITHOUT the +/- corner button, the "-"/"+"
     badge, or the moreHeroes pref UI that made the original feature
     user-toggleable. Oliver's actual objection was the BUTTON ("why do we
     have the plus button in the corner? Get rid of that"), and 523f431 took
     the whole feature rather than half of it because that button was the
     ONLY way to clear a saved promotion -- deleting just the button would
     have left anyone with a saved hero stuck wide forever. This revival
     sidesteps that failure mode entirely: whether a tile is a hero is never
     stored and never user-set, only computed in render() below from
     order.length's parity, so there is no state to get stuck.
     Superseded here is the very next change (commit e948780, then this
     commit's own predecessor): with an ODD count of overflow modules, the
     FIRST tile in the grid (DEFAULT_ORDER's first entry, see render() below
     -- Settings, back when the grid had 5) is the one left alone on row 1
     with an empty cell beside it, since 2-per-row leaves a single leftover
     on an odd count. e948780 rendered that leftover as a normal square,
     centred in the row. Oliver saw it and changed his mind ("make the
     settings a hero ... but if we get a sixth it should be normal size") --
     bring back exactly this wide shape for that slot, but only while the
     count is odd. Finances joining as the 6th overflow module (moving out of
     the visible tab bar to make room for Esme) is exactly that predicted
     even-count case: the grid now fills every row two-wide with nothing left
     over, so no tile is special-cased and this class is simply never added
     (see render()'s order.length % 2 check).
     grid-column: span 2 gives it the full row's width; height stays
     var(--gl-tile-side) -- one grid row, not two -- matching the old native
     hero tile exactly: full content width, ordinary tile height, never
     square, never taller. The bridge still maps the "moreHeroes" pref key
     (GLWebBridge.m); harmless, unread, unrelated to this mechanism.
     2026-10-03: the odd-count hero moved from the FIRST tile to the LAST
     (Oliver wants two tiles on the top row); see render(). */
  .gl-tile.hero {
    grid-column: span 2;
    height: var(--gl-tile-side, 173px);
  }

  .gl-tile.dragging {
    opacity: 0.55;
    z-index: 2;
  }

  .gl-icon-chip {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 16px;
    /* Tinted accent, matching the old native chip's
       accentColor at 0.18 alpha (GLMoreGridViewController -applyTheme). */
    background: color-mix(in srgb, var(--gl-accent) 18%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gl-icon-chip svg {
    width: 26px;
    height: 26px;
    color: var(--gl-accent);
  }

  .gl-tile-title {
    font-size: 15px;
    font-weight: 600;
  }

  /* more.html has no visible header (Oliver: "we don't need the 'More'
     title at the top") -- but page.css's shared .gl-header rule
     (`padding-top: max(14px, env(safe-area-inset-top, 0px))`) was the ONLY
     thing giving this page clearance below the status bar / notch / Dynamic
     Island. Deleting the header markup below without replacing that
     clearance would let the loading spinner/error banner/grid/empty-state
     render UNDER the status bar on a real device. Re-apply the identical
     value directly to body here -- a literal copy, not a shared var, since
     settings.html/recents.html still use the real header and must NOT be
     touched by this change. page.css's own `body` rule only sets
     padding-BOTTOM (env(safe-area-inset-bottom)), so this padding-top
     addition doesn't fight or override it.
     The flex/justify-content:center below is the second ask ("the grid
     isn't vertically centered"): exactly one of the four state divs
     (#gl-loading/#gl-error/#gl-grid/#gl-empty) is ever visible at a time
     (see showLoading/showError/showGrid in the script, which toggle
     page.css's `.gl-hidden{display:none!important}` on the rest) --
     centering this flex container centers whichever one that is, using the
     real WKWebView viewport height (html,body{height:100%} in page.css)
     minus this padding-top and page.css's own padding-bottom. `.gl-hidden`'s
     `!important` still wins over flex-item display, so hidden siblings take
     no space and don't skew the centering. #gl-grid keeps its own
     `display:grid` once un-hidden -- flex only decides where the grid BLOCK
     sits in the page, not the grid's own internal layout, so
     applyTileGeometry()'s square-tile math (unchanged) is unaffected.
     min-height (overriding page.css's fixed height:100%) is what lets the
     page scroll once the grid is taller than the screen: with a fixed
     height, centred overflow spills equally above the top, where it can
     never be scrolled to, and the document never grows. */
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: auto;
    min-height: 100%;
    padding-top: max(14px, env(safe-area-inset-top, 0px));
  }

</style>
</head>
<body>
<div id="gl-loading" class="gl-empty-state">
  <div class="gl-spinner" style="margin:0 auto 12px auto"></div>
  Loading…
</div>

<div id="gl-error" class="gl-error-banner gl-hidden">
  <span id="gl-error-text"></span>
  <button class="gl-btn-plain" id="gl-retry-btn" type="button">Retry</button>
</div>

<div id="gl-grid" class="gl-hidden" role="list"></div>

<div id="gl-empty" class="gl-empty-state gl-hidden">No modules available.</div>

<script>
(function () {
  'use strict';

  var LONG_PRESS_MS = 400;
  var MOVE_CANCEL_PX = 10;
  // GLModuleRegistry's restorationIdentifier for GrowthModule.
  var GROWTH_ID = 'GLModule.GrowthModule';

  var gridEl = document.getElementById('gl-grid');
  var loadingEl = document.getElementById('gl-loading');
  var errorEl = document.getElementById('gl-error');
  var errorTextEl = document.getElementById('gl-error-text');
  var emptyEl = document.getElementById('gl-empty');
  var retryBtn = document.getElementById('gl-retry-btn');

  var byId = new Map();
  var order = [];
  var openPending = false;

  // GLTheme spacingS (see Shared/GLTheme.m) -- the gutter between tiles.
  // #gl-grid's own `gap` above must stay equal to this: applyTileGeometry()
  // re-derives the native "side = floor((contentWidth - gutter) / 2)" tile
  // size from it, and if the two ever disagreed the computed square size
  // would silently stop matching what the CSS grid actually laid out.
  var TILE_GUTTER_PX = 12;

  // Inline-SVG stand-ins for the SF Symbols the old native grid used per
  // module (+moduleIcon in each Modules/*/*.m) -- more.html has no access to
  // SF Symbols, only these hand-drawn approximations. Keyed by the
  // "GLModule.<ClassName>" restoration identifier GLModuleRegistry hands
  // back from listModules (see +makeViewControllers). `currentColor` picks
  // up .gl-icon-chip svg's `color: var(--gl-accent)` from the CSS above, and
  // the couple of "knockout" shapes below use var(--gl-surface) so they read
  // as a cutout against the icon's own filled background rather than the
  // page background, whatever the current theme is.
  var MODULE_ICONS = {
    'GLModule.FootballModule': // soccerball
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="9"/>' +
      '<path d="M12 8l3.500 2.500-1.300 4H9.800l-1.300-4zM12 8V3M15.500 10.500l5-1.500M14.200 14.500l3 4M9.800 14.500l-3 4M8.500 10.500l-5-1.500"/>' +
      '</svg>',
    'GLModule.OutfitsModule': // tshirt.fill
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M8.500 3.500L2 7l2 4.500 2.500-1V20.500h11V10.500l2.500 1L22 7l-6.500-3.500a3.700 3.700 0 0 1-7 0z"/>' +
      '</svg>',
    'GLModule.FinancesModule': // dollarsign.circle.fill
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<circle cx="12" cy="12" r="10"/>' +
      '<path d="M14.7 9.4c-.3-.9-1.3-1.5-2.7-1.5-1.5 0-2.6.8-2.6 1.9 0 2.6 5.4 1.3 5.4 4 0 1.2-1.2 2-2.8 2-1.4 0-2.5-.6-2.9-1.600M12 6.400v1.500M12 16.100v1.5" fill="none" stroke="var(--gl-surface)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>',
    'GLModule.SessionsModule': // terminal.fill
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<rect x="2.5" y="4" width="19" height="16" rx="3.5"/>' +
      '<path d="M7 9.500l3 2.5-3 2.500M12.5 15h4.5" fill="none" stroke="var(--gl-surface)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>',
    'GLModule.GrowthModule': // leaf.fill
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M4.5 19.500C4 11 9 4.5 20 4c0 11-6 15.5-13 15.500z"/>' +
      '<path d="M5 19c3-4.5 6-7 10.5-9" fill="none" stroke="var(--gl-surface)" stroke-width="1.5" stroke-linecap="round"/>' +
      '</svg>',
    'GLModule.EventsModule': // calendar.badge.clock
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M5.5 4h9A3.5 3.5 0 0 1 18 7.500v3.200a6.5 6.5 0 0 0-7.7 8.300H5.500A3.5 3.5 0 0 1 2 15.500v-8A3.5 3.5 0 0 1 5.5 4z"/>' +
      '<path d="M6.5 2.500v3M13.5 2.500v3M2 9.500h16" fill="none" stroke="var(--gl-surface)" stroke-width="1.5" stroke-linecap="round"/>' +
      '<circle cx="17.5" cy="17.5" r="5"/>' +
      '<path d="M17.5 15v2.700l1.7 1" fill="none" stroke="var(--gl-surface)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>',
    'GLModule.EsmeModule': // heart.fill
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M12 21s-8.5-5.300-8.5-11.500A4.800 4.800 0 0 1 12 6.600a4.800 4.800 0 0 1 8.500 2.900C20.500 15.700 12 21 12 21z"/>' +
      '</svg>',
    'GLModule.AutoJournalModule': // Journal -- mic.circle.fill
      '<svg viewBox="0 0 24 24">' +
      '<circle cx="12" cy="12" r="10" fill="currentColor"/>' +
      '<rect x="9.5" y="6" width="5" height="8" rx="2.5" fill="var(--gl-surface)"/>' +
      '<path d="M7.5 12.3a4.5 4.5 0 0 0 9 0" stroke="var(--gl-surface)" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
      '<path d="M12 16.8v2.2" stroke="var(--gl-surface)" stroke-width="1.6" stroke-linecap="round"/>' +
      '</svg>',
    'GLModule.GoalTrackerModule': // gamecontroller.fill
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M7 6h10a5 5 0 0 1 4.900 4l1 5.500a3 3 0 0 1-5.200 2.400L16 16H8l-1.700 1.900a3 3 0 0 1-5.200-2.400l1-5.500A5 5 0 0 1 7 6z"/>' +
      '<path d="M7.500 9v1.500H6v1.500h1.500v1.500H9V12h1.500v-1.500H9V9z" fill="var(--gl-surface)"/>' +
      '<circle cx="15.500" cy="10" r="1" fill="var(--gl-surface)"/><circle cx="17.500" cy="12" r="1" fill="var(--gl-surface)"/>' +
      '</svg>',
    'GLModule.SleepTrackerModule': // bed.double.fill
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M2 6.500a1 1 0 0 1 2 0V13h16v-2.500a3 3 0 0 0-3-3h-6V13H4V6.500M2 14h20v4.500a1 1 0 0 1-2 0V17H4v1.500a1 1 0 0 1-2 0z"/>' +
      '<circle cx="7.500" cy="10" r="1.800"/>' +
      '</svg>',
    'GLModule.DebateModule': // scalemass
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M12 3v17M7 20.500h10M4 7h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' +
      '<path d="M4 7.500l-2.500 6a3 3 0 0 0 5 0zM20 7.500l-2.500 6a3 3 0 0 0 5 0z"/>' +
      '</svg>',
    'GLModule.ClipsModule': // waveform
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
      '<path d="M3 12h0M7 8v8M11 4v16M15 7v10M19 10v4M21 12h0"/>' +
      '</svg>',
    'GLModule.TrackerModule': // location.fill
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M12 2c-4.4 0-8 3.6-8 8 0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z"/>' +
      '<circle cx="12" cy="10" r="3" fill="var(--gl-surface)"/>' +
      '</svg>',
    'GLModule.SettingsModule': // gearshape.fill
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2zm9 3.6c0 .5 0 1-.1 1.5l2 1.6-2 3.4-2.3-.9c-.8.6-1.7 1.1-2.6 1.4l-.3 2.5H10.3l-.3-2.5c-.9-.3-1.8-.8-2.6-1.4l-2.3.9-2-3.4 2-1.6C5 13 5 12.5 5 12s0-1 .1-1.5l-2-1.6 2-3.4 2.3.9c.8-.6 1.7-1.1 2.6-1.4L10.3 2.5h3.4l.3 2.5c.9.3 1.8.8 2.6 1.4l2.3-.9 2 3.4-2 1.6c.1.5.1 1 .1 1.5z"/>' +
      '</svg>',
    'GLModule.UploadModule': // square.and.arrow.up
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M12 3v11"/>' +
      '<path d="M8 7l4-4 4 4"/>' +
      '<path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>' +
      '</svg>'
  };
  // Plain rounded square: a neutral "this module has no mapped glyph yet"
  // stand-in, deliberately not blank -- an empty chip reads as a rendering
  // bug, this reads as a placeholder.
  var FALLBACK_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="4" y="4" width="16" height="16" rx="4"/>' +
    '</svg>';

  // Drag state
  var drag = null; // { id, longPressTimer, startX, startY, active }

  function showLoading() {
    loadingEl.classList.remove('gl-hidden');
    errorEl.classList.add('gl-hidden');
    gridEl.classList.add('gl-hidden');
    emptyEl.classList.add('gl-hidden');
  }

  function showError(message) {
    loadingEl.classList.add('gl-hidden');
    gridEl.classList.add('gl-hidden');
    emptyEl.classList.add('gl-hidden');
    errorTextEl.textContent = message;
    errorEl.classList.remove('gl-hidden');
  }

  function showGrid() {
    loadingEl.classList.add('gl-hidden');
    errorEl.classList.add('gl-hidden');
    if (order.length === 0) {
      emptyEl.classList.remove('gl-hidden');
      gridEl.classList.add('gl-hidden');
    } else {
      emptyEl.classList.add('gl-hidden');
      gridEl.classList.remove('gl-hidden');
    }
  }

  // Default display order for the overflow grid, applied when no saved
  // drag-reorder pref covers a module. This REPLACES "registry order"
  // (the +moduleOrder each Modules/*/*.m class declares, see
  // GLModuleRegistry.m) as the fallback deliberately -- Oliver picked a
  // specific final layout (see the dated note on DEFAULT_ORDER below) and this is the page-only half of shipping it (render()'s
  // order.length parity check + the ".gl-tile.hero" CSS above render
  // whichever id ends up first as the row-1 hero ONLY while the module count
  // is odd). The SAME sequence is mirrored as +moduleOrder values in the
  // native module classes so the two stay in sync --
  // WebPagesTests' test_more_default_order_matches_native_module_order
  // (events repo) guards the two from drifting apart. A module id not in
  // this list (a new module class added later) is NOT dropped: the
  // fallback loop below still appends it, in registry order, after this
  // default sequence is exhausted.
  // 2026-09-28: Oliver moved Upload and Tracker to the very bottom
  // (native: Upload 690, Tracker 700). Quotes became a standalone app.
  var DEFAULT_ORDER = [
    'GLModule.SettingsModule',
    'GLModule.FinancesModule',
    'GLModule.AutoJournalModule',
    'GLModule.EsmeModule',
    'GLModule.GrowthModule',
    'GLModule.OutfitsModule',
    'GLModule.UploadModule',
    'GLModule.TrackerModule',
    'GLModule.GoalTrackerModule',
    'GLModule.SleepTrackerModule',
    'GLModule.DebateModule',
    'GLModule.ClipsModule',
    'GLModule.FootballModule'
  ];

  // The saved drag order is stored as { version, order }. Bumping
  // ORDER_VERSION discards every order saved under an older version (incl.
  // the original bare-array format) so a new DEFAULT_ORDER actually shows
  // up; otherwise the saved order, which covers every module, would hide it
  // forever. Bumped to 2 with the Upload/Quotes/Tracker move, which also
  // cleared orders scrambled by the old hold-jitter reorder bug.
  var ORDER_VERSION = 2;
  function savedOrderFromPref(value) {
    return value && value.version === ORDER_VERSION ? value.order : null;
  }

  function buildDisplayOrder(modules, savedOrder) {
    var seen = new Set();
    var moduleIdOrder = [];
    var map = new Map();
    (Array.isArray(modules) ? modules : []).forEach(function (m) {
      if (!m || typeof m.identifier !== 'string' || m.identifier === '') return;
      if (seen.has(m.identifier)) return; // duplicate identifier: keep first occurrence
      seen.add(m.identifier);
      map.set(m.identifier, m);
      moduleIdOrder.push(m.identifier);
    });
    var result = [];
    var used = new Set();
    if (Array.isArray(savedOrder)) {
      savedOrder.forEach(function (id) {
        if (typeof id === 'string' && map.has(id) && !used.has(id)) {
          result.push(id);
          used.add(id);
        }
      });
    }
    DEFAULT_ORDER.forEach(function (id) {
      if (map.has(id) && !used.has(id)) {
        result.push(id);
        used.add(id);
      }
    });
    // Anything left (a module not named in DEFAULT_ORDER -- i.e. a new
    // module class added since this list was last updated) still gets
    // appended, in registry order, so it can never silently vanish from
    // the grid just for being unlisted here.
    moduleIdOrder.forEach(function (id) {
      if (!used.has(id)) {
        result.push(id);
        used.add(id);
      }
    });
    return { order: result, byId: map };
  }

  function render() {
    gridEl.innerHTML = '';
    // With an odd tile count, 2-per-row leaves one tile alone. That tile is
    // the LAST one and it goes wide (.gl-tile.hero) to fill the bottom row;
    // Oliver wants two normal tiles on the top row, not one wide one.
    var lastIndex = order.length - 1;
    var lastTileIsHero = order.length % 2 === 1;
    order.forEach(function (id, index) {
      var mod = byId.get(id);
      if (!mod) return;
      var tile = document.createElement('div');
      tile.className = 'gl-tile' + (index === lastIndex && lastTileIsHero ? ' hero' : '');
      tile.dataset.id = id;
      tile.setAttribute('role', 'listitem');

      var iconChip = document.createElement('div');
      iconChip.className = 'gl-icon-chip';
      // innerHTML is safe here: both operands come from MODULE_ICONS/
      // FALLBACK_ICON above, fixed markup this file defines itself, never
      // from `mod` (the bridge-supplied module descriptor).
      iconChip.innerHTML = MODULE_ICONS[id] || FALLBACK_ICON;
      tile.appendChild(iconChip);

      var title = document.createElement('div');
      title.className = 'gl-tile-title';
      title.textContent = mod.title != null ? String(mod.title) : id;
      tile.appendChild(title);

      gridEl.appendChild(tile);
    });
    applyTileGeometry();
  }

  // Re-derives the old native grid's "side = floor((contentWidth - gutter)
  // / 2)" square-tile size (GLMoreGridViewController, see git show
  // 862d5f4) from the grid's OWN measured width, and publishes it as
  // --gl-tile-side for the CSS above to use as every tile's explicit
  // height. Driven off the grid's real layout rather than the viewport
  // width so it stays correct through safe-area insets and iPad/split-view
  // widths without duplicating those calculations here. Re-run on resize
  // (rotation, or the app window resizing under Stage Manager) since the
  // computed side is a snapshot, not a live CSS relationship.
  function applyTileGeometry() {
    var style = getComputedStyle(gridEl);
    var contentWidth = gridEl.clientWidth - parseFloat(style.paddingLeft || '0') - parseFloat(style.paddingRight || '0');
    var side = Math.floor((contentWidth - TILE_GUTTER_PX) / 2);
    if (side > 0) {
      gridEl.style.setProperty('--gl-tile-side', side + 'px');
    }
  }
  window.addEventListener('resize', applyTileGeometry);

  function persistOrder() {
    GLBridge.call('setPref', { key: 'moreOrder', value: { version: ORDER_VERSION, order: order.slice() } }).catch(function () {});
  }

  // `demo` rides along on every open (false for an ordinary tap) so a plain
  // tap on Growth also takes it back OUT of demo mode -- GrowthViewController
  // reloads only when the flag actually changes. Other modules ignore it.
  function openTapped(id, demo) {
    if (openPending) return; // double-fire guard
    openPending = true;
    GLBridge.call('openModule', { identifier: id, demo: !!demo }).then(function () {
      openPending = false;
    }, function () {
      openPending = false;
    });
  }

  // Index of the tile the finger is actually over, or null over a gap. The
  // held tile itself counts (and moveInOrder treats it as "no move"): the old
  // "nearest OTHER tile's centre" version always returned a neighbour, so
  // every 1px of finger jitter during a hold swapped the held tile, re-laid
  // out the grid under the finger, and swapped again -- tiles visibly
  // shuffling while Growth was being held for demo mode.
  function findTargetIndex(x, y) {
    var tiles = gridEl.querySelectorAll('.gl-tile');
    for (var i = 0; i < tiles.length; i++) {
      var r = tiles[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
        return order.indexOf(tiles[i].dataset.id);
      }
    }
    return null;
  }

  function moveInOrder(id, targetIndex) {
    var from = order.indexOf(id);
    if (from === -1 || targetIndex === null || targetIndex === from) return;
    order.splice(from, 1);
    order.splice(targetIndex, 0, id);
  }

  function endDrag(persist) {
    if (!drag) return;
    if (drag.longPressTimer) clearTimeout(drag.longPressTimer);
    var wasActive = drag.active;
    var id = drag.id;
    drag = null;
    render();
    attachHandlers();
    if (wasActive && persist) persistOrder();
  }

  function onTileTouchStart(e) {
    var tile = e.currentTarget;
    if (e.touches.length !== 1) return;
    var touch = e.touches[0];
    var id = tile.dataset.id;
    drag = {
      id: id,
      active: false,
      startX: touch.clientX,
      startY: touch.clientY,
      longPressTimer: setTimeout(function () {
        if (!drag || drag.id !== id) return;
        drag.active = true;
        var el = gridEl.querySelector('.gl-tile[data-id="' + cssEscape(id) + '"]');
        if (el) el.classList.add('dragging');
      }, LONG_PRESS_MS)
    };
  }

  function onTileTouchMove(e) {
    if (!drag) return;
    var touch = e.touches[0];
    if (!touch) return;
    if (!drag.active) {
      var dx = touch.clientX - drag.startX;
      var dy = touch.clientY - drag.startY;
      if (Math.sqrt(dx * dx + dy * dy) > MOVE_CANCEL_PX) {
        // Movement before the long-press fired: treat as a scroll/tap gesture, not a drag.
        clearTimeout(drag.longPressTimer);
        drag = null;
      }
      return;
    }
    e.preventDefault();
    if (Math.hypot(touch.clientX - drag.startX, touch.clientY - drag.startY) > MOVE_CANCEL_PX) drag.moved = true;
    var targetIndex = findTargetIndex(touch.clientX, touch.clientY);
    if (targetIndex !== null && targetIndex !== order.indexOf(drag.id)) {
      moveInOrder(drag.id, targetIndex);
      var draggingId = drag.id;
      render();
      attachHandlers();
      var el = gridEl.querySelector('.gl-tile[data-id="' + cssEscape(draggingId) + '"]');
      if (el) el.classList.add('dragging');
    }
  }

  function onTileTouchEnd(e) {
    if (!drag) return;
    var wasActive = drag.active;
    var moved = drag.moved;
    var id = drag.id;
    clearTimeout(drag.longPressTimer);
    drag = null;
    if (wasActive && !moved && id === GROWTH_ID) {
      // Hold-and-release on Growth (no drag) opens it in demo mode; a hold
      // that moves is still an ordinary reorder, handled below.
      e.preventDefault();
      render();
      attachHandlers();
      openTapped(id, true);
    } else if (wasActive) {
      render();
      attachHandlers();
      persistOrder();
    } else {
      // Without this, WebKit still synthesizes a compatibility `click`
      // shortly after this touchend (nothing upstream called
      // preventDefault on the gesture), and the tile's own `click` listener
      // below -- there for the non-touch/mouse fallback -- fires
      // openTapped() a SECOND time for the same finger tap. openPending
      // does not catch it: the native reply to the first openModule call
      // typically lands (resetting openPending) before the synthesized
      // click even fires. preventDefault() here suppresses that synthetic
      // click outright, so a real tap can only ever reach openTapped once.
      e.preventDefault();
      openTapped(id);
    }
  }

  function cssEscape(s) {
    return String(s).replace(/["\\]/g, '\\$&');
  }

  function attachHandlers() {
    gridEl.querySelectorAll('.gl-tile').forEach(function (tile) {
      tile.addEventListener('touchstart', onTileTouchStart, { passive: true });
      tile.addEventListener('touchmove', onTileTouchMove, { passive: false });
      tile.addEventListener('touchend', onTileTouchEnd, { passive: false });
      tile.addEventListener('touchcancel', function () { endDrag(false); }, { passive: true });
      // Non-touch fallback (mouse / trackpad in tests or on a non-touch build).
      tile.addEventListener('click', function () {
        openTapped(tile.dataset.id);
      });
    });
  }

  function load() {
    showLoading();
    Promise.all([
      GLBridge.call('listModules', {}),
      GLBridge.call('getPref', { key: 'moreOrder' })
    ]).then(function (results) {
      var modulesResult = results[0] || {};
      var orderResult = results[1] || {};
      var built = buildDisplayOrder(modulesResult.modules, savedOrderFromPref(orderResult.value));
      byId = built.byId;
      order = built.order;
      render();
      attachHandlers();
      showGrid();
    }, function (err) {
      showError((err && err.message) || 'bridge unavailable');
    });
  }

  retryBtn.addEventListener('click', load);

  GLBridge.onThemeChanged(function () { /* CSS vars re-applied by gl-bridge.js itself; no rebuild needed */ });

  load();
})();
</script>
</body>
</html>
